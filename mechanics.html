<!DOCTYPE html>
<html lang="zh-Hans" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>墟构工程总数据库</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&family=IBM+Plex+Sans+JP:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="mechanics.css?v=102">

  <style id="mechanics-v95-layout">
    /* v95 · compact header / rooted engineering spine / finding-aid work index */
    :root{
      --topbar-h:60px;
      --engineering-left-pad:22px;
      --engineering-spine-x:34px;
      --engineering-spine-start:47px;
      --engineering-branch-gap:17px
    }

    .mechanics-topbar{
      height:var(--topbar-h) !important;
      gap:24px !important;
      padding:0 24px !important
    }
    .mechanics-nav{gap:28px !important}
    .mechanics-nav a{font-size:11px !important}
    .reader-tone-control{height:28px !important;gap:7px !important}
    .reader-tone-track-wrap,
    .reader-tone-slider{width:150px !important;height:28px !important}
    .reader-tone-warm-mark{top:12px !important}
    .language-switch{font-size:10px !important}

    .project-index{
      border-right:0 !important;
      padding:24px 28px 36px 34px !important
    }
    .project-index-head{
      margin:0 0 24px !important;
      color:var(--reader-text) !important;
      opacity:.60 !important;
      line-height:1.06 !important
    }
    .project-index-kicker,
    .project-index-subtitle{
      font-size:12px !important;
      line-height:1.08 !important;
      letter-spacing:.04em !important
    }
    .project-index-subtitle{margin-top:2px !important}

    /* The left column becomes an archival finding-aid: each top-level work/project
       is a quiet framed register rather than another competing tree. */
    .selection-tree{
      display:grid !important;
      gap:14px !important;
      padding:0 0 24px !important
    }
    .selection-group{
      position:relative;
      margin:0 !important;
      display:grid;
      gap:7px
    }
    .selection-group + .selection-group{margin-top:5px !important}
    .selection-group-heading{
      min-height:22px !important;
      margin:0 0 1px 0 !important;
      padding:0 8px !important;
      align-items:center !important;
      border:1px solid var(--reader-line) !important;
      background:rgba(255,255,251,.28);
      color:var(--reader-muted) !important;
      font-size:10px !important;
      letter-spacing:.06em
    }
    .selection-group-heading .tree-dash{display:none !important}
    .selection-group-nodes,
    .selection-group-tree-label > .selection-group-nodes{
      display:grid !important;
      gap:7px !important;
      margin:0 !important;
      padding:0 !important;
      border-left:0 !important
    }
    .selection-group-nodes > .selection-node{
      position:relative;
      padding:7px 9px 8px !important;
      border:1px solid var(--reader-line) !important;
      background:rgba(255,255,251,.18);
      transition:border-color .14s ease,background .14s ease
    }
    .selection-group-nodes > .selection-node:hover{
      border-color:var(--reader-line-strong) !important;
      background:rgba(255,255,251,.42)
    }
    .selection-group-nodes > .selection-node.is-selected-route{
      border-color:var(--reader-line-strong) !important;
      background:rgba(255,255,251,.62)
    }
    .selection-group-nodes > .selection-node > .selection-row{
      min-height:24px !important;
      padding-left:0 !important;
      font-size:13px !important;
      align-items:center !important
    }
    .selection-group-nodes > .selection-node > .selection-row .tree-dash{
      width:9px !important;
      flex-basis:9px !important;
      opacity:.44 !important
    }
    .selection-group-nodes > .selection-node > .selection-children{
      margin:5px 0 0 13px !important;
      padding:3px 0 1px 12px !important;
      border-left:1px solid var(--tree-line) !important
    }
    .selection-group-nodes > .selection-node.is-selected-route > .selection-children{
      border-left-color:var(--reader-line-strong) !important
    }
    .selection-children .selection-row{
      min-height:24px !important;
      padding-left:calc(max(0,var(--tree-depth) - 1) * 13px) !important;
      gap:8px !important;
      font-size:11px !important
    }
    .selection-select,
    .selection-branch-label{opacity:.62 !important}
    .selection-node.is-selected-route > .selection-row > .selection-branch-label,
    .selection-node.is-selected > .selection-row > .selection-select{
      opacity:1 !important
    }

    .engineering-index{
      padding:20px 26px 22px 0 !important;
      overflow:hidden !important;
      border-right:1px solid var(--reader-line) !important;
      background-color:var(--reader-paper) !important;
      background-image:linear-gradient(var(--tree-line),var(--tree-line)) !important;
      background-repeat:no-repeat !important;
      background-position:var(--engineering-spine-x) var(--engineering-spine-start) !important;
      background-size:1px calc(100% - var(--engineering-spine-start)) !important;
      --taxonomy-row-h:22px
    }
    .engineering-title{
      margin:0 0 9px var(--engineering-left-pad) !important;
      line-height:1 !important
    }
    .engineering-title > [data-i18n="engineeringDatabase"]{opacity:.60}
    .engineering-title-square{opacity:1 !important}
    .engineering-taxonomy{
      position:relative;
      z-index:2;
      padding:0 0 3px calc(var(--engineering-spine-x) + var(--engineering-branch-gap)) !important
    }
    .engineering-taxonomy > .taxonomy-node > .taxonomy-row{position:relative}
    .engineering-taxonomy > .taxonomy-node > .taxonomy-row::before{
      content:"";
      position:absolute;
      left:calc(var(--engineering-branch-gap) * -1);
      top:50%;
      width:var(--engineering-branch-gap);
      border-top:1px solid var(--tree-line);
      transform:translateY(-.5px);
      pointer-events:none
    }
    .engineering-taxonomy > .taxonomy-node.is-route > .taxonomy-row::before,
    .engineering-taxonomy > .taxonomy-node.is-target > .taxonomy-row::before{
      border-top-color:var(--reader-text)
    }
    .taxonomy-row{
      min-height:var(--taxonomy-row-h) !important;
      height:var(--taxonomy-row-h) !important;
      line-height:1 !important;
      overflow:visible;
      position:relative;
      z-index:1
    }
    .taxonomy-row[data-taxonomy-depth="0"]{font-size:11.5px !important}
    .taxonomy-row[data-taxonomy-depth="1"]{font-size:10.8px !important}
    .taxonomy-row[data-taxonomy-depth="2"],
    .taxonomy-row[data-taxonomy-depth="3"]{font-size:10.2px !important}
    .taxonomy-children{
      margin-left:15px !important;
      padding-left:13px !important
    }
    .taxonomy-row .taxonomy-label{
      display:inline-block;
      transform-origin:left center;
      transform:translateX(var(--fish-shift,0px)) scale(var(--fish-scale,1));
      transition:transform 116ms cubic-bezier(.22,.65,.2,1),color 100ms ease,opacity 100ms ease;
      will-change:transform
    }
    .taxonomy-row.is-fisheye-near{z-index:6}
    .taxonomy-row.is-fisheye-near .taxonomy-label{color:var(--reader-text)}

    /* v95 · elongated, overlapping physical-file rack */
    .file-extraction-tray{
      --tray-card-w:72px;
      --tray-card-h:132px;
      position:absolute;
      z-index:36;
      left:0;
      right:0;
      bottom:0;
      height:160px;
      display:none;
      align-items:flex-end;
      justify-content:center;
      border-top:1px solid var(--reader-line-strong);
      background:linear-gradient(to bottom,rgba(242,242,237,.10),rgba(242,242,237,.56) 31%,var(--reader-bg) 100%);
      overflow:visible;
      perspective:1100px;
      pointer-events:auto
    }
    body.has-file-extraction-tray .file-extraction-tray{display:flex}
    .file-tray-rack{
      width:100%;
      height:100%;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      padding:28px 36px 8px;
      overflow:visible;
      scrollbar-width:none
    }
    .file-tray-rack::-webkit-scrollbar{display:none}
    .file-tray-item{
      appearance:none;
      position:relative;
      z-index:1;
      flex:0 0 var(--tray-card-w);
      width:var(--tray-card-w);
      height:var(--tray-card-h);
      margin-left:var(--tray-overlap,-28px);
      padding:0;
      border:0;
      background:transparent;
      opacity:.27;
      transform:
        translate3d(calc(var(--hover-x,0px) + var(--selected-push,0px)),calc(34px - var(--hover-lift,0px)),0)
        rotateY(-27deg)
        skewY(-4deg);
      transform-origin:50% 100%;
      transition:transform .20s cubic-bezier(.2,.76,.2,1),opacity .16s ease,filter .16s ease;
      outline:none
    }
    .file-tray-item:first-child{margin-left:0}
    .file-tray-item::before,
    .file-tray-item::after{
      content:"";
      position:absolute;
      inset:0;
      clip-path:polygon(0 100%,0 35%,28% 0,100% 0,100% 100%);
      pointer-events:none
    }
    .file-tray-item::before{background:var(--reader-line-strong)}
    .file-tray-item::after{
      inset:1.2px;
      background:rgba(255,255,251,.28)
    }
    .file-tray-item.is-near{
      z-index:4;
      opacity:.52
    }
    .file-tray-item.is-active{
      z-index:12;
      opacity:1;
      transform:
        translate3d(calc(var(--hover-x,0px) + var(--selected-push,0px)),-58px,18px)
        rotateY(-10deg)
        skewY(-2deg);
      filter:none
    }
    .file-tray-item.is-active::after{background:rgba(255,255,251,.96)}
    .file-tray-index{
      position:absolute;
      z-index:3;
      right:7px;
      bottom:7px;
      color:var(--reader-faint);
      font:300 7px/1 "IBM Plex Mono",monospace;
      letter-spacing:.06em;
      transform:skewY(4deg) rotateY(12deg);
      opacity:.72;
      pointer-events:none
    }
    .file-tray-item.is-active .file-tray-index{
      color:var(--reader-muted);
      opacity:1
    }

    body.has-file-extraction-tray .sheet-stack.is-selected .archive-sheet.is-back{
      display:none !important
    }
    body.has-file-extraction-tray .sheet-stack.is-selected .archive-sheet.is-front{
      width:min(78%,850px) !important;
      height:min(64%,625px) !important;
      min-height:410px !important;
      right:30px !important;
      bottom:174px !important;
      transform:none !important
    }

    @media(max-width:1450px){
      :root{--engineering-left-pad:18px}
      .project-index{padding-left:24px !important;padding-right:22px !important}
    }
    @media(max-width:1100px){
      :root{--topbar-h:56px}
      .mechanics-topbar{height:56px !important;padding:0 16px !important}
      .reader-tone-track-wrap,.reader-tone-slider{width:112px !important}
      .file-extraction-tray{height:148px}
      body.has-file-extraction-tray .sheet-stack.is-selected .archive-sheet.is-front{
        width:82% !important;
        right:16px !important;
        bottom:158px !important;
        min-height:360px !important
      }
    }
    @media(max-width:800px){
      .engineering-index{overflow:visible !important}
      .engineering-title{margin-left:28px !important}
      .taxonomy-row{height:auto !important;min-height:26px !important}
      .taxonomy-row .taxonomy-label{transform:none !important}
      .file-extraction-tray{height:138px;overflow:hidden}
      .file-tray-rack{overflow-x:auto;overflow-y:hidden;justify-content:flex-start}
      .file-tray-item{margin-left:-20px}
      .file-tray-item:first-child{margin-left:0}
      body.has-file-extraction-tray .sheet-stack.is-selected .archive-sheet.is-front{
        width:calc(100% - 36px) !important;
        right:18px !important;
        bottom:150px !important;
        min-height:340px !important
      }
    }
  </style>


  <style id="mechanics-v96-file-rack">
    /* v96 · labelled archive files / directory register / physical pull motion */
    .file-extraction-tray{
      height:154px !important;
      display:none;
      align-items:stretch !important;
      justify-content:stretch !important;
      overflow:visible !important;
      background:linear-gradient(to bottom,rgba(242,242,237,.04),rgba(242,242,237,.50) 30%,var(--reader-bg) 100%) !important
    }
    body.has-file-extraction-tray .file-extraction-tray{display:block !important}
    .file-tray-directory{
      position:absolute;
      z-index:6;
      left:0;
      right:0;
      top:0;
      height:27px;
      display:flex;
      align-items:center;
      padding:0 20px;
      border-bottom:1px solid var(--reader-line);
      background:rgba(242,242,237,.68);
      color:var(--reader-muted);
      font:300 8px/1.1 "IBM Plex Mono",monospace;
      letter-spacing:.025em;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      pointer-events:none
    }
    .file-tray-directory::before{
      content:"directory /";
      margin-right:9px;
      color:var(--reader-faint);
      letter-spacing:.08em
    }
    .file-tray-rack{
      position:absolute !important;
      left:0;
      right:0;
      top:27px;
      bottom:0;
      width:auto !important;
      height:auto !important;
      display:flex !important;
      align-items:flex-end !important;
      justify-content:center !important;
      padding:16px 38px 7px !important;
      overflow:visible !important;
      perspective:1180px !important;
      isolation:isolate
    }
    .file-tray-item{
      --base-y:24px;
      --selected-shift:0px;
      --hover-spread:0px;
      --hover-lift:0px;

      flex:0 0 var(--tray-card-w,72px) !important;
      width:var(--tray-card-w,72px) !important;

    }
    .file-tray-item:first-child{margin-left:0 !important}
    .file-tray-item::before,
    .file-tray-item::after{clip-path:polygon(0 100%,0 34%,27% 0,100% 0,100% 100%) !important}
    .file-tray-item::after{inset:1.15px !important;background:rgba(255,255,251,.26) !important}
    .file-tray-item.is-near{opacity:.48 !important;z-index:5 !important}
    .file-tray-item.is-active{
      --base-y:-61px;
      --rack-z:20;
      opacity:1 !important;
      transform:translate3d(calc(var(--selected-shift) + var(--hover-spread)),calc(var(--base-y) - var(--hover-lift)),16px) rotateY(-13deg) rotateZ(-.35deg) skewY(-2.2deg) !important
    }
    .file-tray-item.is-active::after{background:rgba(255,255,251,.95) !important}
    .file-tray-name{
      position:absolute;
      z-index:4;
      left:7px;
      right:5px;
      bottom:8px;
      display:block;
      overflow:hidden;
      color:var(--reader-muted);
      font:300 7px/1.18 "IBM Plex Mono",monospace;
      letter-spacing:.01em;
      white-space:nowrap;
      text-overflow:ellipsis;
      transform:skewY(4deg) rotateY(11deg);
      transform-origin:left bottom;
      opacity:.82;
      pointer-events:none
    }
    .file-tray-item.is-active .file-tray-name{color:var(--reader-text);opacity:1}
    .file-tray-index{top:7px !important;right:6px !important;bottom:auto !important;font-size:6.5px !important;opacity:.48 !important}
    .file-tray-item.is-active .file-tray-index{opacity:.72 !important}
    body.has-file-extraction-tray .sheet-stack.is-selected .archive-sheet.is-front{bottom:166px !important}
    @media(max-width:1100px){
      .file-extraction-tray{height:146px !important}
      .file-tray-directory{height:25px;padding:0 15px}
      .file-tray-rack{top:25px;padding-left:24px !important;padding-right:24px !important}
      body.has-file-extraction-tray .sheet-stack.is-selected .archive-sheet.is-front{bottom:156px !important}
    }
    @media(max-width:800px){
      .file-extraction-tray{height:136px !important;overflow:hidden !important}
      .file-tray-rack{overflow-x:auto !important;overflow-y:hidden !important;justify-content:flex-start !important}

      body.has-file-extraction-tray .sheet-stack.is-selected .archive-sheet.is-front{bottom:146px !important}
    }
  </style>

<body>
  <header class="mechanics-topbar" aria-label="site tools">
    <nav class="mechanics-nav">
      <a href="manifesto.html" data-i18n="manifesto">墟构师宣言 ↗</a>
      <a href="index.html" data-i18n="archive">遗构馆 ↗</a>
    </nav>

    <div class="reader-tone-control" aria-label="reader tone">
      <span class="reader-tone-icon" aria-hidden="true">☼</span>
      <div class="reader-tone-track-wrap">
        <input class="reader-tone-slider" data-reader-tone type="range" min="0" max="100" value="0" step="1" aria-label="阅读环境">

    <div class="language-switch" aria-label="Language">
      <button type="button" data-lang-switch="zh">中</button>
      <span>/</span>
      <button type="button" data-lang-switch="en">EN</button>
      <span>/</span>

  <main class="mechanics-shell">
    <aside id="project-index" class="project-index" aria-label="works and projects">
      <div class="project-index-head">
        <div class="project-index-kicker" data-i18n="worksSegments">作品 / 档案段</div>
        <div class="project-index-subtitle" data-i18n="browseByWork">按作品检索</div>
        <p class="project-index-description" data-i18n="databaseIntro">这里不是作品目录，而是“技术点”的检索入口。以作品为线索，追踪其中使用、生成或修正的技术、经验、想法、技法与工法；这些实践再归入中央的「墟构工程总数据库」，持续归档并互相连接。</p>
      </div>
      <div id="selection-tree" class="selection-tree"></div>
    </aside>

    <aside id="engineering-index" class="engineering-index" aria-label="engineering database">
      <h1 class="engineering-title">
        <span class="engineering-title-square" aria-hidden="true"></span>
        <span data-i18n="engineeringDatabase">墟构工程总数据库</span>
      </h1>
      <div id="engineering-taxonomy" class="engineering-taxonomy"></div>
    </aside>

    <section id="archive-stage" class="archive-stage" tabindex="0" aria-label="archive sheets">
      <div id="sheet-stack" class="sheet-stack is-empty" aria-live="polite"></div>
      <div id="file-extraction-tray" class="file-extraction-tray" aria-label="archive file rack" aria-hidden="true">
        <div id="file-tray-directory" class="file-tray-directory" aria-live="polite"></div>
        <div id="file-tray-rack" class="file-tray-rack"></div>
      </div>
    </section>

    <svg id="directory-connector" class="directory-connector" aria-hidden="true">
      <path id="directory-connector-path"></path>
      <path id="taxonomy-route-path"></path>
    </svg>
  </main>

  <script src="mechanics-data.js?v=102"></script>
  <script>
    /* Keep Exploding Whale as one searchable branch: all existing files sit under Degradation. */
    (() => {
      const D = window.RUINWRIGHT_ENGINEERING_ARCHIVE;
      if (!D?.selectionGroups) return;
      let whale = null;
      for (const group of D.selectionGroups) {
        whale = (group.entries || []).find(entry => entry.id === 'exploding-whale') || whale;
      }
      if (!whale?.children) return;

      const degradation = whale.children.find(child => child.id === 'exploding-whale-degradation');
      const release = whale.children.find(child => child.id === 'exploding-whale-explosive-release');
      if (!degradation) return;

      const rename = record => {
        const suffix = String(record.id || '').replace('exploding-whale-', '');
        const labels = {
          design:['降解 · 设计','Degradation · design','分解 · デザイン'],
          sketch:['降解 · 草图','Degradation · sketch','分解 · スケッチ'],
          'prototype-01':['降解 · 原型 1','Degradation · prototype 1','分解 · プロトタイプ 1'],
          'prototype-02':['降解 · 原型 2','Degradation · prototype 2','分解 · プロトタイプ 2'],
          'prototype-03':['降解 · 原型 3','Degradation · prototype 3','分解 · プロトタイプ 3']
        };
        const notes = {
          design:['环境输入 / 降解 · design.jpg','Environmental input / degradation · design.jpg','環境入力 / 分解 · design.jpg'],
          sketch:['环境输入 / 降解 · sketch.png','Environmental input / degradation · sketch.png','環境入力 / 分解 · sketch.png'],
          'prototype-01':['环境输入 / 降解 · prototype-01.jpg','Environmental input / degradation · prototype-01.jpg','環境入力 / 分解 · prototype-01.jpg'],
          'prototype-02':['环境输入 / 降解 · prototype-02.heic','Environmental input / degradation · prototype-02.heic','環境入力 / 分解 · prototype-02.heic'],
          'prototype-03':['环境输入 / 降解 · prototype-03.jpg','Environmental input / degradation · prototype-03.jpg','環境入力 / 分解 · prototype-03.jpg']
        };
        if (!labels[suffix]) return record;
        return {
          ...record,
          title:{zh:labels[suffix][0],en:labels[suffix][1],ja:labels[suffix][2]},
          note:{zh:notes[suffix][0],en:notes[suffix][1],ja:notes[suffix][2]}
        };
      };

      if (release?.records?.length) {
        degradation.records = [...(degradation.records || []), ...release.records.map(rename)];
      }
      whale.children = [degradation];
    })();
  </script>

  <script src="mechanics.js?v=102"></script>

  <script>
    (() => {
      const engineeringIndex = document.getElementById('engineering-index');
      const titleSquare = document.querySelector('.engineering-title-square');
      const selectionTree = document.getElementById('selection-tree');
      const taxonomyRoot = document.getElementById('engineering-taxonomy');
      const connector = document.getElementById('directory-connector');
      const path = document.getElementById('directory-connector-path');
      const routePath = document.getElementById('taxonomy-route-path');
      const projectIndex = document.getElementById('project-index');
      const stage = document.getElementById('archive-stage');
      const stack = document.getElementById('sheet-stack');
      const tray = document.getElementById('file-extraction-tray');
      const rack = document.getElementById('file-tray-rack');
      if (!engineeringIndex || !titleSquare || !selectionTree || !taxonomyRoot || !connector || !path || !routePath || !projectIndex || !stage || !stack || !tray || !rack) return;

      const TRAY_THRESHOLD = 5;
      let connectorRaf = 0;
      let fitRaf = 0;
      let trayRaf = 0;
      let writingConnector = false;
      let fishInside = false;
      let fishY = null;

      function topLevelTaxonomyNode(node) {
        let current = node;
        while (current?.parentElement?.classList.contains('taxonomy-children')) {
          current = current.parentElement.closest('.taxonomy-node');
        }
        return current;
      }

      function syncSpineMetrics() {
        const ir = engineeringIndex.getBoundingClientRect();
        const sr = titleSquare.getBoundingClientRect();
        engineeringIndex.style.setProperty('--engineering-spine-x', `${(sr.left + sr.width / 2 - ir.left).toFixed(2)}px`);
        engineeringIndex.style.setProperty('--engineering-spine-start', `${Math.max(0, sr.bottom - ir.top).toFixed(2)}px`);
        const lastRootRow = taxonomyRoot.lastElementChild?.querySelector(':scope > .taxonomy-row');
        const rr = lastRootRow?.getBoundingClientRect();
        if (rr) {
          engineeringIndex.style.setProperty('--engineering-spine-end', `${Math.max(sr.bottom - ir.top, rr.top + rr.height / 2 - ir.top).toFixed(2)}px`);
        }
      }

      function redrawConnector() {
        connectorRaf = 0;
        syncSpineMetrics();

        const selected = selectionTree.querySelector('.selection-node.is-selected .selection-select');
        const targetNode = taxonomyRoot.querySelector('.taxonomy-node.is-target');
        if (!selected || !targetNode) {
          connector.classList.remove('is-visible');
          if (path.getAttribute('d') || routePath.getAttribute('d')) {
            writingConnector = true;
            path.setAttribute('d','');
            routePath.setAttribute('d','');
            writingConnector = false;
          }
          return;
        }

        const targetRow = targetNode.querySelector(':scope > .taxonomy-row');
        const targetLabel = targetRow?.querySelector(':scope > .taxonomy-label');
        if (!targetRow || !targetLabel) return;

        const a = selected.getBoundingClientRect();
        const b = targetLabel.getBoundingClientRect();
        const pr = projectIndex.getBoundingClientRect();
        const ir = engineeringIndex.getBoundingClientRect();
        const sr = titleSquare.getBoundingClientRect();
        if (a.bottom < pr.top || a.top > pr.bottom || b.bottom < ir.top || b.top > ir.bottom) {
          connector.classList.remove('is-visible');
          return;
        }

        const spineX = sr.left + sr.width / 2;
        // The work-index launch line behaves like an underline and stops exactly
        // at the database spine (the purple reference line in the design sketch).
        const y1 = a.bottom + 1.5;
        const leftUnderline = Math.max(pr.left + 8, a.left - 1);
        const d = `M ${leftUnderline.toFixed(1)} ${y1.toFixed(1)} H ${spineX.toFixed(1)}`;

        // Build a second, heavier path only along the actual taxonomy route. This
        // avoids the old behaviour where an entire child rail became dark even
        // below the selected technical point.
        const routeNodes = [];
        let cursor = targetNode;
        while (cursor?.classList.contains('taxonomy-node')) {
          routeNodes.unshift(cursor);
          const parentChildren = cursor.parentElement;
          if (!parentChildren?.classList.contains('taxonomy-children')) break;
          cursor = parentChildren.parentElement?.closest('.taxonomy-node');
        }

        const routeSegments = [];
        if (routeNodes.length) {
          const rootRow = routeNodes[0].querySelector(':scope > .taxonomy-row');
          const rootRect = rootRow?.getBoundingClientRect();
          if (rootRect) {
            const rootY = rootRect.top + rootRect.height / 2;
            routeSegments.push(`M ${spineX.toFixed(1)} ${y1.toFixed(1)} V ${rootY.toFixed(1)} H ${rootRect.left.toFixed(1)}`);
          }

          for (let i = 1; i < routeNodes.length; i += 1) {
            const parentRow = routeNodes[i - 1].querySelector(':scope > .taxonomy-row');
            const childRow = routeNodes[i].querySelector(':scope > .taxonomy-row');
            const rail = routeNodes[i].parentElement;
            const parentRect = parentRow?.getBoundingClientRect();
            const childRect = childRow?.getBoundingClientRect();
            const railRect = rail?.getBoundingClientRect();
            if (!parentRect || !childRect || !railRect) continue;
            const parentY = parentRect.top + parentRect.height / 2;
            const childY = childRect.top + childRect.height / 2;
            const railX = railRect.left;
            routeSegments.push(`M ${railX.toFixed(1)} ${parentY.toFixed(1)} V ${childY.toFixed(1)} H ${childRect.left.toFixed(1)}`);
          }
        }

        const routeD = routeSegments.join(' ');
        connector.setAttribute('viewBox', `0 0 ${innerWidth} ${innerHeight}`);
        connector.classList.add('is-visible');
        if (path.getAttribute('d') !== d || routePath.getAttribute('d') !== routeD) {
          writingConnector = true;
          path.setAttribute('d', d);
          routePath.setAttribute('d', routeD);
          writingConnector = false;
        }
      }

      function scheduleConnector() {
        cancelAnimationFrame(connectorRaf);
        connectorRaf = requestAnimationFrame(redrawConnector);
      }

      function taxonomyDepth(row) {
        let depth = 0;
        let cursor = row.parentElement;
        while (cursor && cursor !== taxonomyRoot) {
          if (cursor.classList.contains('taxonomy-children')) depth += 1;
          cursor = cursor.parentElement;
        }
        return depth;
      }

      function fitTaxonomy() {
        fitRaf = 0;
        const rows = [...taxonomyRoot.querySelectorAll('.taxonomy-row')];
        if (!rows.length || innerWidth <= 800) return;
        rows.forEach(row => { row.dataset.taxonomyDepth = String(taxonomyDepth(row)); });
        const er = engineeringIndex.getBoundingClientRect();
        const tr = taxonomyRoot.getBoundingClientRect();
        const available = Math.max(250, er.bottom - tr.top - 5);
        const rowHeight = Math.max(13.5, Math.min(23, available / rows.length));
        engineeringIndex.style.setProperty('--taxonomy-row-h', `${rowHeight.toFixed(2)}px`);
        if (fishInside && Number.isFinite(fishY)) requestAnimationFrame(() => applyFisheye(fishY));
      }

      function scheduleFit() {
        cancelAnimationFrame(fitRaf);
        fitRaf = requestAnimationFrame(fitTaxonomy);
      }

      function resetFisheye() {
        taxonomyRoot.querySelectorAll('.taxonomy-row').forEach(row => {
          row.style.setProperty('--fish-scale','1');
          row.style.setProperty('--fish-shift','0px');
          row.classList.remove('is-fisheye-near');
        });
      }

      function applyFisheye(clientY) {
        if (!fishInside || innerWidth <= 800) return;
        const rows = [...taxonomyRoot.querySelectorAll('.taxonomy-row')];
        const radius = Math.max(54, Math.min(82, engineeringIndex.clientHeight * .085));
        rows.forEach(row => {
          const rect = row.getBoundingClientRect();
          const center = rect.top + rect.height / 2;
          const distance = Math.abs(clientY - center);
          const proximity = Math.max(0, 1 - distance / radius);
          const depth = Number(row.dataset.taxonomyDepth || taxonomyDepth(row));
          const maxScale = depth >= 2 ? 1.22 : depth === 1 ? 1.15 : 1.09;
          const eased = proximity * proximity * (3 - 2 * proximity);
          const scale = 1 + (maxScale - 1) * eased;
          row.style.setProperty('--fish-scale', scale.toFixed(3));
          row.style.setProperty('--fish-shift', `${((scale - 1) * 2.4).toFixed(2)}px`);
          row.classList.toggle('is-fisheye-near', proximity > .13);
        });
      }

      engineeringIndex.addEventListener('mousemove', event => {
        if (innerWidth <= 800) return;
        fishInside = true;
        fishY = event.clientY;
        applyFisheye(fishY);
      }, {passive:true});
      engineeringIndex.addEventListener('mouseleave', () => {
        fishInside = false;
        fishY = null;
        resetFisheye();
      }, {passive:true});

      function currentRecordIndex(count) {
        const raw = decodeURIComponent(location.hash.slice(1));
        const pieces = raw.split('/').filter(Boolean);
        const parsed = parseInt(pieces[pieces.length - 1],10);
        if (Number.isFinite(parsed) && parsed >= 1) return Math.min(count - 1, parsed - 1);
        return Math.max(0, count - 1);
      }

      function activateTrayIndex(targetIndex, count, activeIndex) {
        if (targetIndex === activeIndex) return;
        const backs = [...stack.querySelectorAll('.archive-sheet.is-back')];
        const order = Array.from({length:count},(_,index) => index).filter(index => index !== activeIndex);
        const slot = order.indexOf(targetIndex);
        if (slot >= 0 && backs[slot]) backs[slot].click();
      }

      function applySelectedPush(activeIndex) {
        const items = [...rack.querySelectorAll('.file-tray-item')];
        items.forEach((item,index) => {
          if (index === activeIndex) {
            item.style.setProperty('--selected-push','0px');
            return;
          }
          const distance = Math.abs(index - activeIndex);
          const strength = Math.max(0, 1 - distance / 4.5);
          const direction = index < activeIndex ? -1 : 1;
          item.style.setProperty('--selected-push', `${(direction * strength * 24).toFixed(1)}px`);
        });
      }

      function clearRackHover() {
        rack.querySelectorAll('.file-tray-item').forEach(item => {
          item.style.setProperty('--hover-x','0px');
          item.style.setProperty('--hover-lift','0px');
          item.classList.remove('is-near');
        });
      }

      rack.addEventListener('pointermove', event => {
        const items = [...rack.querySelectorAll('.file-tray-item')];
        if (!items.length) return;
        const radius = 128;
        items.forEach(item => {
          const rect = item.getBoundingClientRect();
          const center = rect.left + rect.width / 2;
          const dx = center - event.clientX;
          const distance = Math.abs(dx);
          const proximity = Math.max(0, 1 - distance / radius);
          const eased = proximity * proximity * (3 - 2 * proximity);
          const direction = dx < 0 ? -1 : 1;
          item.style.setProperty('--hover-x', `${(direction * eased * 18).toFixed(1)}px`);
          item.style.setProperty('--hover-lift', `${(eased * 12).toFixed(1)}px`);
          item.classList.toggle('is-near', proximity > .14);
        });
      }, {passive:true});
      rack.addEventListener('pointerleave', clearRackHover, {passive:true});

      function syncTray() {
        trayRaf = 0;
        const sheets = [...stack.querySelectorAll(':scope > .archive-sheet')];
        const count = sheets.length;
        const enabled = stack.classList.contains('is-selected') && count > TRAY_THRESHOLD;
        document.body.classList.toggle('has-file-extraction-tray', enabled);
        tray.setAttribute('aria-hidden', enabled ? 'false' : 'true');
        if (!enabled) {
          rack.replaceChildren();
          return;
        }

        const activeIndex = currentRecordIndex(count);
        const usableWidth = Math.max(280, stage.clientWidth - 72);
        const cardWidth = Math.max(52, Math.min(82, usableWidth / Math.max(5.2, count * .68)));
        const cardHeight = Math.max(96, Math.min(148, cardWidth * 1.86));
        const overlap = -Math.max(18, Math.min(38, cardWidth * .43));
        tray.style.setProperty('--tray-card-w', `${cardWidth.toFixed(1)}px`);
        tray.style.setProperty('--tray-card-h', `${cardHeight.toFixed(1)}px`);
        tray.style.setProperty('--tray-overlap', `${overlap.toFixed(1)}px`);

        const fragment = document.createDocumentFragment();
        for (let index = 0; index < count; index += 1) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = `file-tray-item${index === activeIndex ? ' is-active' : ''}`;
          button.setAttribute('aria-label', `档案 ${index + 1} / ${count}`);
          button.setAttribute('aria-pressed', index === activeIndex ? 'true' : 'false');
          button.title = `${index + 1} / ${count}`;
          const number = document.createElement('span');
          number.className = 'file-tray-index';
          number.textContent = String(index + 1).padStart(2,'0');
          button.appendChild(number);
          button.addEventListener('click', () => activateTrayIndex(index,count,activeIndex));
          fragment.appendChild(button);
        }
        rack.replaceChildren(fragment);
        applySelectedPush(activeIndex);
      }

      function scheduleTray() {
        if (typeof window.__mechanicsRackSyncV96 === 'function') {
          window.__mechanicsRackSyncV96();
        }
      }

      const pathObserver = new MutationObserver(() => {
        if (!writingConnector) scheduleConnector();
      });
      pathObserver.observe(path,{attributes:true,attributeFilter:['d']});

      const treeObserver = new MutationObserver(() => {
        scheduleConnector();
        scheduleFit();
        if (fishInside && Number.isFinite(fishY)) requestAnimationFrame(() => applyFisheye(fishY));
      });
      treeObserver.observe(selectionTree,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});
      treeObserver.observe(taxonomyRoot,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});

      const stackObserver = new MutationObserver(scheduleTray);
      stackObserver.observe(stack,{childList:true,subtree:false,attributes:true,attributeFilter:['class']});

      addEventListener('resize',() => {
        scheduleConnector();
        scheduleFit();
        scheduleTray();
      },{passive:true});
      projectIndex.addEventListener('scroll',scheduleConnector,{passive:true});
      engineeringIndex.addEventListener('scroll',() => {
        scheduleConnector();
        if (fishInside && Number.isFinite(fishY)) requestAnimationFrame(() => applyFisheye(fishY));
      },{passive:true});
      addEventListener('ruinlanguagechange',() => {
        scheduleConnector();
        scheduleFit();
        scheduleTray();
      });

      scheduleConnector();
      scheduleFit();
      scheduleTray();
    })();
  </script>
  <script id="mechanics-v96-rack-script">
    (() => {
      const stack = document.getElementById('sheet-stack');
      const stage = document.getElementById('archive-stage');
      const tray = document.getElementById('file-extraction-tray');
      const rack = document.getElementById('file-tray-rack');
      const directory = document.getElementById('file-tray-directory');
      if (!stack || !stage || !tray || !rack || !directory) return;

      const THRESHOLD = 5;
      let raf = 0;
      let signature = '';

      const basename = path => String(path || '').split('/').filter(Boolean).pop() || 'untitled';
      const dirname = path => {
        const parts = String(path || '').split('/').filter(Boolean);
        parts.pop();
        return parts.join('/') + (parts.length ? '/' : '');
      };

      function sheetData() {
        const sheets = [...stack.querySelectorAll(':scope > .archive-sheet')];
        const records = sheets.map(sheet => {
          const source = sheet.querySelector('.sheet-source')?.textContent?.trim() || '';
          return {sheet, source, name:basename(source), active:sheet.classList.contains('is-front')};
        }).filter(record => record.source);
        records.sort((a,b) => a.name.localeCompare(b.name, undefined, {numeric:true,sensitivity:'base'}));
        return records;
      }

      function setRackGeometry(count) {
        const usable = Math.max(290, stage.clientWidth - 86);
        const width = Math.max(58, Math.min(78, usable / Math.max(4.7, count * .58)));
        const height = Math.max(78, Math.min(102, width * 1.31));
        const overlap = -Math.max(27, Math.min(43, width * .52));
        tray.style.setProperty('--tray-card-w', `${width.toFixed(1)}px`);
        tray.style.setProperty('--tray-card-h', `${height.toFixed(1)}px`);
        tray.style.setProperty('--tray-overlap', `${overlap.toFixed(1)}px`);
      }

      function updateSelectedPush(activePath) {
        const items = [...rack.querySelectorAll('.file-tray-item')];
        const activeIndex = items.findIndex(item => item.dataset.path === activePath);
        items.forEach((item,index) => {
          const active = index === activeIndex;
          item.classList.toggle('is-active', active);
          item.setAttribute('aria-pressed', active ? 'true' : 'false');
          if (activeIndex < 0 || active) {
            item.style.setProperty('--selected-shift','0px');
            return;
          }
          const distance = Math.abs(index - activeIndex);
          const force = Math.max(0, 1 - distance / 4.2);
          const direction = index < activeIndex ? -1 : 1;
          item.style.setProperty('--selected-shift', `${(direction * force * 17).toFixed(1)}px`);
        });
      }

      function activatePath(path) {
        const sheets = [...stack.querySelectorAll(':scope > .archive-sheet')];
        const target = sheets.find(sheet => sheet.querySelector('.sheet-source')?.textContent?.trim() === path);
        if (!target || target.classList.contains('is-front')) return;
        target.click();
      }

      function buildRack(records) {
        const fragment = document.createDocumentFragment();
        records.forEach((record,index) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'file-tray-item';
          button.dataset.path = record.source;
          button.title = record.name;
          button.setAttribute('aria-label', record.name);
          button.setAttribute('aria-pressed','false');

          const number = document.createElement('span');
          number.className = 'file-tray-index';
          number.textContent = String(index + 1).padStart(2,'0');

          const name = document.createElement('span');
          name.className = 'file-tray-name';
          name.textContent = record.name;

          button.append(number,name);
          button.addEventListener('click', () => activatePath(record.source));
          fragment.appendChild(button);
        });
        rack.replaceChildren(fragment);
      }

      function clearHover() {
        rack.querySelectorAll('.file-tray-item').forEach(item => {
          item.style.setProperty('--hover-spread','0px');
          item.style.setProperty('--hover-lift','0px');
          item.classList.remove('is-near');
        });
      }

      rack.addEventListener('pointermove', event => {
        const items = [...rack.querySelectorAll('.file-tray-item')];
        const radius = 104;
        items.forEach(item => {
          const rect = item.getBoundingClientRect();
          const center = rect.left + rect.width / 2;
          const dx = center - event.clientX;
          const proximity = Math.max(0, 1 - Math.abs(dx) / radius);
          const eased = proximity * proximity * (3 - 2 * proximity);
          const direction = dx < 0 ? -1 : 1;
          item.style.setProperty('--hover-spread', `${(direction * eased * 14).toFixed(1)}px`);
          item.style.setProperty('--hover-lift', `${(eased * 9).toFixed(1)}px`);
          item.classList.toggle('is-near', proximity > .16);
        });
      }, {capture:true,passive:true});
      rack.addEventListener('pointerleave', clearHover, {capture:true,passive:true});

      function sync() {
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(() => {
          const records = sheetData();
          const enabled = stack.classList.contains('is-selected') && records.length > THRESHOLD;
          document.body.classList.toggle('has-file-extraction-tray', enabled);
          tray.setAttribute('aria-hidden', enabled ? 'false' : 'true');
          if (!enabled) {
            signature = '';
            rack.replaceChildren();
            directory.textContent = '';
            return;
          }

          setRackGeometry(records.length);
          const active = records.find(record => record.active) || records[records.length - 1];
          directory.textContent = dirname(active?.source || '');
          const nextSignature = records.map(record => record.source).join('|');
          if (nextSignature !== signature) {
            signature = nextSignature;
            buildRack(records);
            requestAnimationFrame(() => updateSelectedPush(active?.source || ''));
          } else {
            updateSelectedPush(active?.source || '');
          }
        });
      }

      window.__mechanicsRackSyncV96 = sync;
      const observer = new MutationObserver(sync);
      observer.observe(stack,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
      addEventListener('resize',sync,{passive:true});
      addEventListener('ruinlanguagechange',sync);
      sync();
    })();
  </script>
