<!DOCTYPE html>
<html lang="zh-Hans" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>墟构工程总数据库</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&family=IBM+Plex+Sans+JP:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="mechanics.css?v=91">
  <script src="ruin-language.js?v=74"></script>
</head>
<body>
  <header class="mechanics-topbar" aria-label="site tools">
    <nav class="mechanics-nav">
      <a href="manifesto.html" data-i18n="manifesto">墟构师宣言 ↗</a>
      <a href="index.html" data-i18n="archive">遗构馆 ↗</a>
    </nav>

    <div class="reader-tone-control" aria-label="reader tone">
      <span class="reader-tone-icon" aria-hidden="true">☼</span>
      <div class="reader-tone-track-wrap">
        <input class="reader-tone-slider" data-reader-tone type="range" min="0" max="100" value="0" step="1" aria-label="阅读环境">
        <span class="reader-tone-warm-mark" aria-hidden="true"></span>
      </div>
      <span class="reader-tone-icon" aria-hidden="true">☾</span>
    </div>

    <div class="language-switch" aria-label="Language">
      <button type="button" data-lang-switch="zh">中</button>
      <span>/</span>
      <button type="button" data-lang-switch="en">EN</button>
      <span>/</span>
      <button type="button" data-lang-switch="ja">JP</button>
    </div>
  </header>

  <main class="mechanics-shell">
    <aside id="project-index" class="project-index" aria-label="works and projects">
      <div class="project-index-head">
        <div class="project-index-kicker" data-i18n="worksSegments">作品 / 档案段</div>
        <div class="project-index-subtitle" data-i18n="browseByWork">按作品检索</div>
      </div>
      <div id="selection-tree" class="selection-tree"></div>
    </aside>

    <aside id="engineering-index" class="engineering-index" aria-label="engineering database">
      <h1 class="engineering-title">
        <span class="engineering-title-square" aria-hidden="true"></span>
        <span data-i18n="engineeringDatabase">墟构工程总数据库</span>
      </h1>
      <div id="engineering-taxonomy" class="engineering-taxonomy"></div>
    </aside>

    <section id="archive-stage" class="archive-stage" tabindex="0" aria-label="archive sheets">
      <div id="sheet-stack" class="sheet-stack is-empty" aria-live="polite"></div>
    </section>

    <svg id="directory-connector" class="directory-connector" aria-hidden="true">
      <path id="directory-connector-path"></path>
    </svg>
  </main>

  <script src="mechanics-data.js?v=91"></script>
  <script src="mechanics.js?v=92"></script>
</body>
</html>
