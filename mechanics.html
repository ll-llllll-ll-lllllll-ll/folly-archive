<!DOCTYPE html>
<html lang="zh-Hans" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>墟构工程总数据库</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&family=IBM+Plex+Sans+JP:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&family=IBM+Plex+Sans+JP:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="mechanics.css?v=120-cleanup">
  <script src="site-language.js?v=2-20261005"></script>
  <script>
    (() => {
      const language = window.RuinSiteLanguage?.read?.() || 'en';
      window.RuinSiteLanguage?.applyDocument?.(language);
    })();
  </script>
  <script src="ruin-language.js?v=121-device-init"></script>
</head>
<body>
  <header class="mechanics-topbar" aria-label="site tools">
    <nav class="mechanics-nav">
      <a href="manifesto.html" data-i18n="manifesto">墟构师宣言 ↗</a>
      <a href="index.html" data-i18n="archive">遗构馆 ↗</a>
    </nav>

    <div class="reader-tone-control" aria-label="reader tone">
      <span class="reader-tone-icon" aria-hidden="true">☼</span>
      <div class="reader-tone-track-wrap">
        <input class="reader-tone-slider" data-reader-tone type="range" min="0" max="100" value="0" step="1" aria-label="阅读环境">
        <span class="reader-tone-warm-mark" aria-hidden="true"></span>
      </div>
      <span class="reader-tone-icon" aria-hidden="true">☾</span>
    </div>

    <div class="language-switch" aria-label="Language">
      <button type="button" data-lang-switch="zh">中</button>
      <span>/</span>
      <button type="button" data-lang-switch="en">EN</button>
      <span>/</span>
      <button type="button" data-lang-switch="ja">JP</button>
    </div>
  </header>

  <nav id="mobile-workspace-nav" class="mobile-workspace-nav" aria-label="mobile mechanics workspace">
    <div class="mobile-workspace-tabs" role="tablist" aria-label="database sections">
      <button type="button" class="mobile-workspace-tab" role="tab" aria-controls="project-index" aria-selected="true" data-mobile-view-target="works">
        <span data-i18n="mobileWorks">作品</span>
      </button>
      <button type="button" class="mobile-workspace-tab" role="tab" aria-controls="engineering-index" aria-selected="false" data-mobile-view-target="database">
        <span data-i18n="mobileDatabase">数据库</span>
      </button>
      <button type="button" class="mobile-workspace-tab" role="tab" aria-controls="archive-stage" aria-selected="false" data-mobile-view-target="archive">
        <span data-i18n="mobileArchive">档案</span>
        <span id="mobile-archive-count" class="mobile-archive-count" hidden></span>
      </button>
    </div>
    <div id="mobile-workspace-context" class="mobile-workspace-context" aria-live="polite">未选择技术点</div>
  </nav>

  <main class="mechanics-shell">
    <aside id="project-index" class="project-index" aria-label="works and projects">
      <div class="project-index-head">
        <p class="project-index-description" data-i18n="databaseIntro">这里收集以「墟构」为目的的创作手法，包括建造废墟园林所用的工法、相关技术、工作记录与实践经验。</p>
        <span class="project-index-divider" aria-hidden="true"></span>
        <div class="project-index-kicker" data-i18n="worksSegments">作品 / 档案段</div>
        <div class="project-index-subtitle" data-i18n="browseByWork">按作品检索</div>
      </div>
      <div id="selection-tree" class="selection-tree"></div>
    </aside>

    <aside id="engineering-index" class="engineering-index" aria-label="engineering database">
      <h1 class="engineering-title">
        <span class="engineering-title-square" aria-hidden="true"></span>
        <span data-i18n="engineeringDatabase">墟构工程总数据库</span>
      </h1>
      <div id="engineering-taxonomy" class="engineering-taxonomy"></div>
    </aside>

    <section id="archive-stage" class="archive-stage" tabindex="0" aria-label="archive sheets">
      <div id="sheet-stack" class="sheet-stack is-empty" aria-live="polite"></div>
      <div id="file-extraction-tray" class="file-extraction-tray" aria-label="archive file rack" aria-hidden="true">
        <div id="file-tray-directory" class="file-tray-directory" aria-live="polite"></div>
        <button id="file-tray-prev" class="file-tray-nav file-tray-prev" type="button" aria-label="previous file" hidden>
          <svg viewBox="0 0 40 60" aria-hidden="true"><path d="M32 6 L8 30 L32 54 Z" /></svg>
        </button>
        <div id="file-tray-rack" class="file-tray-rack"></div>
        <button id="file-tray-next" class="file-tray-nav file-tray-next" type="button" aria-label="next file" hidden>
          <svg viewBox="0 0 40 60" aria-hidden="true"><path d="M8 6 L32 30 L8 54 Z" /></svg>
        </button>
      </div>
    </section>

    <svg id="directory-connector" class="directory-connector" aria-hidden="true">
      <path id="directory-connector-path"></path>
      <path id="taxonomy-route-path"></path>
    </svg>
  </main>

  <script src="mechanics-data.js?v=122-terrain"></script>

  <script src="mechanics.js?v=121-cleanup"></script>
</body>
</html>
