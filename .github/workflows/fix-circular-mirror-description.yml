name: Fix Circular Mirror Remnant Description

on:
  push:
    paths:
      - '.github/workflows/fix-circular-mirror-description.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Escape description paragraph break
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('data/site-data.js')
          s = p.read_text(encoding='utf-8')
          old = '视线里只剩下柱子、植被和一片过分纯净的天空。\n\n这些圆洞原本只是发酵罐撤去后留下的负形'
          new = '视线里只剩下柱子、植被和一片过分纯净的天空。\\n\\n这些圆洞原本只是发酵罐撤去后留下的负形'
          assert old in s, 'raw paragraph break not found'
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-circular-mirror-description.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site-data.js .github/workflows/fix-circular-mirror-description.yml
          git commit -m "Fix Circular Mirror Remnant paragraph break"
          git push origin HEAD:main
