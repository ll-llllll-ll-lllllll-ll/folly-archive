name: mechanics-v110-project-titles

on:
  push:
    paths:
      - '.mechanics-v110-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply project-title patch
        run: python mechanics-v110-project-titles.py
      - name: Commit changes
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add mechanics-data.js mechanics.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Translate mechanics sketch project titles"
          git push origin HEAD:main
