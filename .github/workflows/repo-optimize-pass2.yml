name: repo-optimize-pass2

on:
  push:
    paths:
      - '.github/workflows/repo-optimize-pass2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Consolidate stable Mechanics scripts and non-blocking fonts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          # Mechanics: the two inline scripts execute immediately after mechanics.js.
          # Move them to the tail of mechanics.js in the same order to keep behavior
          # while making the page shell declarative and easier to cache/audit.
          html_path = root / 'mechanics.html'
          js_path = root / 'mechanics.js'
          html = html_path.read_text(encoding='utf-8')
          js = js_path.read_text(encoding='utf-8').rstrip()

          script_pat = re.compile(r'\n\s*<script(?P<attrs>(?![^>]*\bsrc=)[^>]*)>(?P<body>[\s\S]*?)</script>\s*', re.I)
          matches = [m for m in script_pat.finditer(html) if '(() =>' in m.group('body')]
          if len(matches) != 2:
              raise RuntimeError(f'expected exactly 2 Mechanics inline IIFE scripts, found {len(matches)}')

          pieces = []
          for i, m in enumerate(matches, 1):
              id_match = re.search(r'\bid="([^"]+)"', m.group('attrs'))
              label = id_match.group(1) if id_match else f'mechanics-layout-runtime-{i}'
              pieces.append(f'\n\n/* Consolidated from mechanics.html: {label} */\n{m.group("body").strip()}\n')

          for m in reversed(matches):
              html = html[:m.start()] + '\n' + html[m.end():]

          if 'Consolidated from mechanics.html:' not in js:
              js += ''.join(pieces)
          js_path.write_text(js + '\n', encoding='utf-8')
          html = re.sub(r'mechanics\.js\?v=[^\"]+', 'mechanics.js?v=121-cleanup', html, count=1)
          html_path.write_text(html, encoding='utf-8')

          # Use the same non-render-blocking Google Fonts pattern already used by
          # the main map page. The preconnects stay because the fonts are still used.
          for filename in ['mechanics.html','manifesto.html','archive-system.html']:
              p = root / filename
              text = p.read_text(encoding='utf-8')
              links = list(re.finditer(r'<link\s+href="(?P<href>https://fonts\.googleapis\.com/css2\?[^\"]+)"\s+rel="stylesheet">', text))
              if len(links) != 1:
                  raise RuntimeError(f'{filename}: expected exactly one Google Fonts stylesheet after pass 1, found {len(links)}')
              href = links[0].group('href')
              replacement = (
                  f'<link href="{href}" rel="stylesheet" media="print" onload="this.media=\'all\'">\n'
                  f'  <noscript><link href="{href}" rel="stylesheet"></noscript>'
              )
              text = text[:links[0].start()] + replacement + text[links[0].end():]
              p.write_text(text, encoding='utf-8')

          # Remove four obsolete attachment artifacts only if no code contains their full path.
          obsolete = [
              'attachments/rail-side/trainspotting.wav',
              'attachments/aether-scorched-earth/score-1.png',
              'attachments/aether-scorched-earth/score-2.png',
              'attachments/aether-scorched-earth/score-3.png',
          ]
          text_ext = {'.html','.js','.css','.json','.yml','.yaml','.py','.txt','.webmanifest','.svg'}
          corpus_parts = []
          for f in root.rglob('*'):
              if not f.is_file() or '.git/' in f.as_posix() or f.as_posix() == '.github/workflows/repo-optimize-pass2.yml':
                  continue
              if f.suffix.lower() in text_ext:
                  corpus_parts.append(f.read_text(encoding='utf-8', errors='ignore'))
          corpus = '\n'.join(corpus_parts)
          for rel in obsolete:
              if rel in corpus:
                  raise RuntimeError(f'refusing to delete referenced asset: {rel}')
              p = root / rel
              if p.exists():
                  p.unlink()

          (root / 'repo-diagnostics.json').unlink(missing_ok=True)
          PY

      - name: Syntax checks
        shell: bash
        run: |
          set -e
          for f in *.js data/*.js; do
            [ -f "$f" ] && node --check "$f"
          done
          python -m py_compile scripts/*.py

      - name: Final static diagnostic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json
          root = Path('.')
          files = [p for p in root.rglob('*') if p.is_file() and '.git/' not in p.as_posix()]
          def text(p): return p.read_text(encoding='utf-8', errors='ignore')

          html = {}
          for p in files:
              if p.suffix.lower() != '.html': continue
              s = text(p)
              html[p.as_posix()] = {
                  'bytes': p.stat().st_size,
                  'preload': len(re.findall(r'rel=["\']preload["\']', s, re.I)),
                  'modulepreload': len(re.findall(r'rel=["\']modulepreload["\']', s, re.I)),
                  'prefetch': len(re.findall(r'rel=["\']prefetch["\']', s, re.I)),
                  'preconnect': len(re.findall(r'rel=["\']preconnect["\']', s, re.I)),
                  'inline_style_blocks': len(re.findall(r'<style\b', s, re.I)),
                  'inline_script_blocks': len(re.findall(r'<script(?![^>]+src=)[^>]*>', s, re.I)),
                  'blocking_google_font_stylesheets': len(re.findall(r'<link(?=[^>]*fonts\.googleapis\.com)(?=[^>]*rel=["\']stylesheet["\'])(?![^>]*media=["\']print["\'])[^>]*>', s, re.I)),
              }

          js = {}
          for name in ['script.js','archive-system.js','mechanics.js','mechanics-mobile.js','manifesto.js','ruin-language.js']:
              p = root / name
              if not p.exists(): continue
              s = text(p)
              js[name] = {
                  'bytes':p.stat().st_size,
                  'lines':s.count('\n')+1,
                  'addEventListener':s.count('addEventListener('),
                  'MutationObserver':s.count('MutationObserver'),
                  'setTimeout':s.count('setTimeout('),
                  'requestAnimationFrame':s.count('requestAnimationFrame('),
              }

          css = {}
          for name in ['style.css','archive-system.css','mechanics.css','manifesto.css']:
              p = root / name
              if not p.exists(): continue
              s = text(p)
              css[name] = {'bytes':p.stat().st_size,'lines':s.count('\n')+1,'important':s.count('!important'),'media_queries':s.count('@media')}

          report = {
              'baseline_backup_branch':'backup/pre-clean-20260929',
              'file_count':len(files),
              'total_bytes':sum(p.stat().st_size for p in files),
              'html':html,
              'javascript':js,
              'css':css,
              'remaining_high_priority':[ 
                  'Main script.js remains ~1 MB / 25k lines. Its feature sections are highly interdependent; split only with browser regression tests around map wrap, drawers, attachments, score viewers and mobile state.',
                  'Main style.css remains ~650 KB with thousands of !important declarations. Consolidating cascade layers is the largest remaining maintainability win but should be done screen-by-screen, not by blind CSS deduplication.',
                  'Original archive photos/videos are intentionally retained at source quality; they dominate repository size but are content, not startup payload, because viewers load them on demand.'
              ]
          }
          (root/'repo-diagnostics-final.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/repo-optimize-pass2.yml
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add -A
          git status --short
          git commit -m "Consolidate Mechanics runtime and finish repository cleanup"
          git push origin HEAD:main
