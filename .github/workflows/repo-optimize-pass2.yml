name: repo-optimize-pass2

on:
  push:
    paths:
      - '.github/workflows/repo-optimize-pass2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Consolidate stable runtime and remove confirmed dead files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, shutil

          root = Path('.')

          # 1) Mechanics: move the two remaining inline runtime scripts into
          # mechanics.js without changing their execution order.
          html_path = root / 'mechanics.html'
          js_path = root / 'mechanics.js'
          html = html_path.read_text(encoding='utf-8')
          js = js_path.read_text(encoding='utf-8').rstrip()

          external = re.search(r'<script\s+src="mechanics\.js\?v=[^"]+"></script>', html, re.I)
          if not external:
              raise RuntimeError('mechanics.js script tag not found')
          prefix = html[:external.end()]
          tail = html[external.end():]
          inline_pat = re.compile(r'<script(?P<attrs>[^>]*)>(?P<body>[\s\S]*?)</script>', re.I)
          matches = [m for m in inline_pat.finditer(tail) if 'src=' not in m.group('attrs').lower()]
          if len(matches) != 2:
              raise RuntimeError(f'expected exactly 2 inline scripts after mechanics.js, found {len(matches)}')

          pieces = []
          for i, m in enumerate(matches, 1):
              id_match = re.search(r'\bid="([^"]+)"', m.group('attrs'))
              label = id_match.group(1) if id_match else f'mechanics-layout-runtime-{i}'
              pieces.append(f'\n\n/* Consolidated from mechanics.html: {label} */\n{m.group("body").strip()}\n')
          for m in reversed(matches):
              tail = tail[:m.start()] + '\n' + tail[m.end():]
          html = prefix + tail
          if 'Consolidated from mechanics.html:' not in js:
              js += ''.join(pieces)
          js_path.write_text(js + '\n', encoding='utf-8')
          html = re.sub(r'mechanics\.js\?v=[^\"]+', 'mechanics.js?v=121-cleanup', html, count=1)
          html_path.write_text(html, encoding='utf-8')

          # 2) Google Fonts: keep preconnect, but stop CSS font downloads from
          # render-blocking the three secondary pages. This matches index.html.
          for filename in ['mechanics.html','manifesto.html','archive-system.html']:
              p = root / filename
              text = p.read_text(encoding='utf-8')
              links = list(re.finditer(r'<link\s+href="(?P<href>https://fonts\.googleapis\.com/css2\?[^\"]+)"\s+rel="stylesheet">', text))
              if len(links) != 1:
                  raise RuntimeError(f'{filename}: expected one blocking Google Fonts stylesheet, found {len(links)}')
              m = links[0]
              href = m.group('href')
              replacement = (
                  f'<link href="{href}" rel="stylesheet" media="print" onload="this.media=\'all\'">\n'
                  f'  <noscript><link href="{href}" rel="stylesheet"></noscript>'
              )
              text = text[:m.start()] + replacement + text[m.end():]
              p.write_text(text, encoding='utf-8')

          # 3) Confirmed dead media. The first diagnostic report and this workflow
          # are excluded from the reference corpus because they mention candidates.
          obsolete = [
              'attachments/rail-side/trainspotting.wav',
              'attachments/aether-scorched-earth/score-1.png',
              'attachments/aether-scorched-earth/score-2.png',
              'attachments/aether-scorched-earth/score-3.png',
          ]
          text_ext = {'.html','.js','.css','.json','.yml','.yaml','.py','.txt','.webmanifest','.svg'}
          excluded = {
              '.github/workflows/repo-optimize-pass2.yml',
              'repo-diagnostics.json',
              'repo-diagnostics-final.json',
          }
          corpus_parts = []
          for f in root.rglob('*'):
              rel = f.as_posix()
              if not f.is_file() or '.git/' in rel or rel in excluded:
                  continue
              if f.suffix.lower() in text_ext:
                  corpus_parts.append(f.read_text(encoding='utf-8', errors='ignore'))
          corpus = '\n'.join(corpus_parts)
          for rel in obsolete:
              if rel in corpus:
                  raise RuntimeError(f'refusing to delete referenced asset: {rel}')
              (root / rel).unlink(missing_ok=True)

          # 4) Remove generated Python bytecode and prevent it/local junk returning.
          shutil.rmtree(root / 'scripts/__pycache__', ignore_errors=True)
          gitignore = root / '.gitignore'
          wanted = ['.DS_Store','__pycache__/','*.py[cod]','node_modules/']
          existing = gitignore.read_text(encoding='utf-8').splitlines() if gitignore.exists() else []
          for rule in wanted:
              if rule not in existing:
                  existing.append(rule)
          gitignore.write_text('\n'.join(existing).strip() + '\n', encoding='utf-8')

          # First-pass diagnostic has been consumed.
          (root / 'repo-diagnostics.json').unlink(missing_ok=True)
          PY

      - name: Syntax checks without creating bytecode
        shell: bash
        run: |
          set -e
          for f in *.js data/*.js; do
            [ -f "$f" ] && node --check "$f"
          done
          python - <<'PY'
          from pathlib import Path
          for p in Path('scripts').glob('*.py'):
              compile(p.read_text(encoding='utf-8'), str(p), 'exec')
          PY

      - name: Final static diagnostic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json, hashlib, collections
          root = Path('.')
          files = [p for p in root.rglob('*') if p.is_file() and '.git/' not in p.as_posix()]
          def text(p): return p.read_text(encoding='utf-8', errors='ignore')

          html = {}
          for p in files:
              if p.suffix.lower() != '.html': continue
              s = text(p)
              html[p.as_posix()] = {
                  'bytes': p.stat().st_size,
                  'preload': len(re.findall(r'rel=["\']preload["\']', s, re.I)),
                  'modulepreload': len(re.findall(r'rel=["\']modulepreload["\']', s, re.I)),
                  'prefetch': len(re.findall(r'rel=["\']prefetch["\']', s, re.I)),
                  'preconnect': len(re.findall(r'rel=["\']preconnect["\']', s, re.I)),
                  'inline_style_blocks': len(re.findall(r'<style\b', s, re.I)),
                  'inline_script_blocks': len(re.findall(r'<script(?![^>]+src=)[^>]*>', s, re.I)),
                  'blocking_google_font_stylesheets': len(re.findall(r'<link(?=[^>]*fonts\.googleapis\.com)(?=[^>]*rel=["\']stylesheet["\'])(?![^>]*media=["\']print["\'])[^>]*>', s, re.I)),
              }

          js = {}
          for name in ['script.js','archive-system.js','mechanics.js','mechanics-mobile.js','manifesto.js','ruin-language.js']:
              p = root / name
              if not p.exists(): continue
              s = text(p)
              js[name] = {
                  'bytes':p.stat().st_size,
                  'lines':s.count('\n')+1,
                  'addEventListener':s.count('addEventListener('),
                  'MutationObserver':s.count('MutationObserver'),
                  'setTimeout':s.count('setTimeout('),
                  'requestAnimationFrame':s.count('requestAnimationFrame('),
              }

          css = {}
          for name in ['style.css','archive-system.css','mechanics.css','manifesto.css']:
              p = root / name
              if not p.exists(): continue
              s = text(p)
              css[name] = {'bytes':p.stat().st_size,'lines':s.count('\n')+1,'important':s.count('!important'),'media_queries':s.count('@media')}

          hashes = collections.defaultdict(list)
          for p in files:
              if p.stat().st_size < 64 or p.as_posix().startswith('.github/'): continue
              hashes[(p.stat().st_size, hashlib.sha256(p.read_bytes()).hexdigest())].append(p.as_posix())
          exact_dups = [v for v in hashes.values() if len(v) > 1]

          report = {
              'baseline_backup_branch':'backup/pre-clean-20260929',
              'file_count':len(files),
              'total_bytes':sum(p.stat().st_size for p in files),
              'html':html,
              'javascript':js,
              'css':css,
              'exact_duplicate_file_groups':exact_dups,
              'removed_dead_assets':[
                  'attachments/rail-side/trainspotting.wav',
                  'attachments/aether-scorched-earth/score-1.png',
                  'attachments/aether-scorched-earth/score-2.png',
                  'attachments/aether-scorched-earth/score-3.png'
              ],
              'remaining_high_priority':[ 
                  'Main script.js remains about 1 MB / 25k lines. Its feature sections are highly interdependent; split only with browser regression tests around map wrap, drawers, attachments, score viewers and mobile state.',
                  'Main style.css remains about 650 KB with thousands of !important declarations. Consolidating cascade layers is the largest remaining maintainability win but should be done screen-by-screen, not by blind CSS deduplication.',
                  'Original archive photos/videos are intentionally retained at source quality; they dominate repository size but are authored content and are mostly loaded on demand.',
                  'Static analysis finds no HTML preload/modulepreload/prefetch directives. Viewer-local media preload behavior should remain event-driven rather than being promoted to startup preload.'
              ]
          }
          (root/'repo-diagnostics-final.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/repo-optimize-pass2.yml
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add -A
          git status --short
          git commit -m "Consolidate Mechanics runtime and finish repository cleanup"
          git push origin HEAD:main
