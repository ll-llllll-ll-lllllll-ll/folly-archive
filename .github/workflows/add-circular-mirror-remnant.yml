name: Add Circular Mirror Remnant

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-circular-mirror-remnant.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch archive record
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, base64

          site_name = '圆镜残境'
          desc_zh = '磨碟沙深处，原珠江啤酒厂的发酵罐迁离后，只留下成列的混凝土基座。白瓷砖从柱壁与圆环边缘一点点剥落，草木沿裂缝进入其中。抬头时，巨大的圆孔像一枚枚嵌在废墟里的镜框，将天空、珠江与对岸不断生长的城市截成局部。旧工业已经失去原来的容器与功能，却没有完全退出城市；它被刻意留在新城之间缓慢风化，而繁华仍从那些圆洞之外继续扩张。'
          desc_en = 'Deep in Modiesha, after the fermentation tanks of the former Zhujiang Brewery were moved away, only rows of concrete bases remained. White tiles peel little by little from the columns and circular rims, while vegetation enters through the cracks. Looking upward, the huge round openings become frames set into the ruin, cropping the sky, the Pearl River, and the growing city across the water into fragments. The old industry has lost its vessels and function, yet has not entirely withdrawn from the city; deliberately retained among the new towers, it continues to weather while prosperity keeps expanding beyond those circles.'
          desc_ja = '磨碟沙の奥深く、旧珠江ビール工場の発酵タンクが移設されたあと、列をなすコンクリートの基座だけが残された。白いタイルは柱や円環の縁から少しずつ剥がれ、草木が亀裂に沿って入り込んでいる。見上げると、巨大な円孔は廃墟に嵌め込まれた鏡枠のように、空、珠江、そして対岸で増殖し続ける都市を断片として切り取る。旧い工業はかつての容器と機能を失ったが、都市から完全に退いたわけではない。新しい街のあいだに意図的に残され、ゆっくりと風化しながら、その円の向こうでは繁栄だけがなお拡張を続けている。'

          # 1) Main site registry and taxonomy tags.
          p = Path('data/site-data.js')
          s = p.read_text(encoding='utf-8')
          if site_name not in s:
              old = '    "草间稚居": "placed, grass, interstitial, dwelling"\n};'
              new = '    "草间稚居": "placed, grass, interstitial, dwelling",\n    "圆镜残境": "factory, aperture, eroded, grass, interstitial"\n};'
              if old not in s:
                  raise SystemExit('siteTagsMapping anchor not found')
              s = s.replace(old, new, 1)
              cut = s.rfind('\n];')
              if cut < 0:
                  raise SystemExit('sites array end not found')
              head = s[:cut].rstrip()
              if not head.endswith('}'):
                  raise SystemExit('sites array tail unexpected')
              head += ',\n    {\n'
              head += '        name: "圆镜残境",\n'
              head += f'        desc: {desc_zh!r},\n'.replace("'", '"')
              head += '        lat: 23.106610,\n'
              head += '        lng: 113.340957,\n'
              head += '        archiveDate: "2026.10",\n'
              head += '        recordDate: "2026.10.01",\n'
              head += '        recorder: "りか",\n'
              head += '        visitMode: "discovery",\n'
              head += '        type: "record"\n'
              head += '    }'
              s = head + s[cut:]
              p.write_text(s, encoding='utf-8')

          # 2) Archive-system guest-record layer.
          p = Path('archive-system.js')
          s = p.read_text(encoding='utf-8')
          if site_name not in s:
              marker = '\n];\n\nconst i18n = {'
              start = s.find('const EXISTING_SITES = [')
              end = s.find(marker, start)
              if start < 0 or end < 0:
                  raise SystemExit('EXISTING_SITES boundary not found')
              entry = '''\n  {\n    "name": "圆镜残境",\n    "lat": 23.106610,\n    "lng": 113.340957,\n    "type": "record",\n    "archiveDate": "2026.10",\n    "recorder": "りか",\n    "visitMode": "discovery"\n  }'''
              body = s[start:end].rstrip()
              if body.endswith('}'):
                  body += ',' + entry
              else:
                  raise SystemExit('EXISTING_SITES tail unexpected')
              s = s[:start] + body + s[end:]
              p.write_text(s, encoding='utf-8')

          # 3) Add new Ruin Lexicology morpheme: 孔 / aperture.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'data-tag="aperture"' not in s:
              old = '<span class="index-tag" data-tag="column" data-i18n="tag_column">柱</span>'
              new = old + '\n                            <span class="index-tag" data-tag="aperture" data-i18n="tag_aperture">孔</span>'
              if old not in s:
                  raise SystemExit('index tag_column anchor not found')
              s = s.replace(old, new, 1)
          if 'tag_aperture:' not in s:
              old = "    tag_column:       { root: 'styl-',      source: 'Greek', english: 'Column' },"
              new = old + "\n    tag_aperture:     { root: 'foram-',     source: 'Latin', english: 'Aperture' },"
              if old not in s:
                  raise SystemExit('etymology tag_column anchor not found')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 4) Language overrides; append instead of rewriting the large vault object.
          p = Path('data/language-vault.js')
          s = p.read_text(encoding='utf-8')
          marker = '/* circular-mirror-remnant · 2026-10-01 */'
          if marker not in s:
              block = f'''\n\n{marker}\n(() => {{\n  const vault = window.languageVault;\n  if (!vault) return;\n  Object.assign(vault.zh, {{\n    tag_aperture: '孔',\n    desc_recorded_2026_10_01: '记录于：2026.10.01',\n    site_name_圆镜残境: '圆镜残境',\n    site_desc_圆镜残境: {desc_zh!r}\n  }});\n  Object.assign(vault.en, {{\n    tag_aperture: 'Apert.',\n    desc_recorded_2026_10_01: 'Recorded: 2026.10.01',\n    site_name_圆镜残境: 'Circular Mirror Remnant',\n    site_desc_圆镜残境: {desc_en!r}\n  }});\n  Object.assign(vault.ja, {{\n    tag_aperture: '孔',\n    desc_recorded_2026_10_01: '記録：2026.10.01',\n    site_name_圆镜残境: '円鏡の残景',\n    site_desc_圆镜残境: {desc_ja!r}\n  }});\n}})();\n'''
              s += block
              p.write_text(s, encoding='utf-8')

          # 5) Register the authored 128px thumbnail on the main map/archive-doc system.
          p = Path('script.js')
          s = p.read_text(encoding='utf-8')
          if 'thumbnails/circular-mirror-remnant.webp' not in s:
              old = '    "草间稚居": "thumbnails/grass-child-dwelling.webp"\n});'
              new = '    "草间稚居": "thumbnails/grass-child-dwelling.webp",\n    "圆镜残境": "thumbnails/circular-mirror-remnant.webp"\n});'
              if old not in s:
                  raise SystemExit('SITE_THUMBNAILS tail anchor not found')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')

          # 6) Reserve the visual-specimen folder for photo-1.jpg ... photo-8.jpg.
          d = Path('attachments/circular-mirror-remnant')
          d.mkdir(parents=True, exist_ok=True)
          (d / '.gitkeep').write_text('', encoding='utf-8')

          # 7) Write the black-and-white 128×128 WebP thumbnail from the supplied photo.
          b64 = ''''''
          Path('thumbnails').mkdir(exist_ok=True)
          Path('thumbnails/circular-mirror-remnant.webp').write_bytes(base64.b64decode(b64))

          # Basic assertions so the action fails rather than publishing half a record.
          assert '圆镜残境' in Path('data/site-data.js').read_text(encoding='utf-8')
          assert 'data-tag="aperture"' in Path('index.html').read_text(encoding='utf-8')
          assert 'thumbnails/circular-mirror-remnant.webp' in Path('script.js').read_text(encoding='utf-8')
          assert Path('thumbnails/circular-mirror-remnant.webp').stat().st_size > 3000
          print('Circular Mirror Remnant patch prepared.')
          PY

      - name: Commit record and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/add-circular-mirror-remnant.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site-data.js data/language-vault.js index.html script.js archive-system.js thumbnails/circular-mirror-remnant.webp attachments/circular-mirror-remnant/.gitkeep .github/workflows/add-circular-mirror-remnant.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Add guest relic Circular Mirror Remnant"
          git push
