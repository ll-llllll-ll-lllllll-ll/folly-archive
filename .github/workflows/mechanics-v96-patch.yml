name: mechanics-v96-patch

on:
  push:
    paths:
      - '.mechanics-v96-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch mechanics file rack
        run: python mechanics-v96-patch.py
      - name: Commit patch
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add mechanics.html
          git diff --cached --quiet || git commit -m "Refine mechanics physical file rack"
          git push origin HEAD:main
