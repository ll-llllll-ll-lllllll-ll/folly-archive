name: One-time mobile v392 inner-edge fracture integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-v392-inner-edge-fractures.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch mobile side geometry and drawer transparency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          script_path = Path('script.js')
          style_path = Path('style.css')
          index_path = Path('index.html')

          script = script_path.read_text(encoding='utf-8')

          # 1) The absolute viewport rim is a clean architectural frame only.
          # Side chips/cracks belong to the inner edges of the side stone panels,
          # never to the page outside those panels.
          rim_pattern = re.compile(
              r"    // The top and bottom remain calm architectural runs\.\n.*?\n    host\.replaceChildren\(svg\);",
              re.S
          )
          rim_replacement = '''    // v392 · the absolute viewport rim stays clean. Stone damage belongs
    // to the two side-panel INNER rails, not to the page boundary itself.
    addPath(svg, [
      { x: 0.65, y: 0.65 },
      { x: width - 0.65, y: 0.65 }
    ], 'mobile-outer-rim-edge');
    addPath(svg, [
      { x: width - 0.65, y: 0.65 },
      { x: width - 0.65, y: height - 0.65 }
    ], 'mobile-outer-rim-edge');
    addPath(svg, [
      { x: width - 0.65, y: height - 0.65 },
      { x: 0.65, y: height - 0.65 }
    ], 'mobile-outer-rim-edge');
    addPath(svg, [
      { x: 0.65, y: height - 0.65 },
      { x: 0.65, y: 0.65 }
    ], 'mobile-outer-rim-edge');

    host.replaceChildren(svg);'''
          script, n = rim_pattern.subn(rim_replacement, script, count=1)
          if n != 1:
              raise SystemExit(f'outer-rim renderer patch count={n}')

          # 2) Build random chips on the INNER rail of each side panel. The notch
          # opens at the map-facing edge and the crack travels OUTWARD through the
          # stone, stopping well before the external viewport rim.
          cut_anchor = '''        const rightCut = crownSide === 'right'
            ? [rightInnerTop, rightOuterTop]
            : makeStoneCut(rightInnerTop, rightOuterTop, 'right-v382', true);
'''
          inner_helper = '''

        // v392 · side stone damage is owned by the inner rails.
        function buildInnerRailWear(x, yTop, yBottom, side, label) {
            const local = rngFor(`mobile-shell-inner-rail-${label}-v392`);
            const outward = side === 'left' ? -1 : 1;
            const span = Math.max(0, yBottom - yTop);
            const available = side === 'left'
                ? Math.max(4, x - outerLeft)
                : Math.max(4, outerRight - x);
            const count = span > 470 ? 2 : 1;
            const centers = [];
            let guard = 0;

            while (centers.length < count && guard++ < 30) {
                const y = yTop + span * (0.18 + local() * 0.64);
                if (centers.some(other => Math.abs(other - y) < Math.min(150, span * 0.22))) continue;
                centers.push(y);
            }
            centers.sort((a, b) => a - b);

            const topDown = [{ x, y: yTop }];
            const cracks = [];
            centers.forEach((center, index) => {
                const half = 5.2 + local() * 5.8;
                const y0 = clamp(center - half, yTop + 6, yBottom - 16);
                const y1 = clamp(center + half, y0 + 5, yBottom - 6);
                const depth = Math.min(available * 0.34, 2.8 + local() * 5.2);
                const throat = {
                    x: x + outward * depth,
                    y: center + (local() - 0.5) * 1.8
                };

                topDown.push({ x, y: y0 });
                topDown.push({ x: x + outward * depth * 0.24, y: y0 + half * 0.22 });
                topDown.push({ x: x + outward * depth * 0.62, y: center - half * 0.34 });
                topDown.push(throat);
                topDown.push({ x: x + outward * depth * 0.55, y: center + half * 0.38 });
                topDown.push({ x: x + outward * depth * 0.20, y: y1 - half * 0.16 });
                topDown.push({ x, y: y1 });

                const run = Math.min(
                    available * 0.62,
                    depth + 8 + local() * 13
                );
                const lift = (local() - 0.5) * 12;
                cracks.push([
                    throat,
                    { x: x + outward * (depth + (run - depth) * 0.30), y: throat.y + lift * 0.14 },
                    { x: x + outward * (depth + (run - depth) * 0.64), y: throat.y + lift * 0.52 },
                    { x: x + outward * run, y: throat.y + lift }
                ]);
            });
            topDown.push({ x, y: yBottom });
            return { topDown, bottomUp: [...topDown].reverse(), cracks };
        }

        const leftInnerWear = buildInnerRailWear(
            materialInnerLeft,
            leftInnerTop.y,
            frameBottom,
            'left',
            'left'
        );
        const rightInnerWear = buildInnerRailWear(
            materialInnerRight,
            rightInnerTop.y,
            frameBottom,
            'right',
            'right'
        );
'''
          if 'mobile-shell-inner-rail-${label}-v392' not in script:
              if cut_anchor not in script:
                  raise SystemExit('cut anchor missing')
              script = script.replace(cut_anchor, cut_anchor + inner_helper, 1)

          # 3) Use the worn inner rail as the actual panel boundary, so each chip
          # is a genuine opening rather than a decorative line painted over fill.
          replacements = {
'''                { x: materialInnerLeft, y: frameTop },
                { x: materialInnerLeft, y: frameBottom },
                leftDrawerCorner''':
'''                { x: materialInnerLeft, y: frameTop },
                ...leftInnerWear.topDown.slice(1),
                leftDrawerCorner''',
'''                ...leftCut.slice(1),
                { x: materialInnerLeft, y: frameBottom },
                leftDrawerCorner''':
'''                ...leftCut.slice(1),
                ...leftInnerWear.topDown.slice(1),
                leftDrawerCorner''',
'''                rightDrawerCorner,
                { x: materialInnerRight, y: frameBottom },
                { x: materialInnerRight, y: frameTop },
                { x: skeletonRight, y: frameTop },''':
'''                rightDrawerCorner,
                ...rightInnerWear.bottomUp,
                { x: skeletonRight, y: frameTop },''',
'''                rightDrawerCorner,
                { x: materialInnerRight, y: frameBottom },
                ...rightCut,
                { x: outerRight, y: frameBottom },''':
'''                rightDrawerCorner,
                ...rightInnerWear.bottomUp,
                ...rightCut.slice(1),
                { x: outerRight, y: frameBottom },'''
          }
          for old, new in replacements.items():
              if old not in script:
                  raise SystemExit('panel geometry anchor missing:\n' + old)
              script = script.replace(old, new, 1)

          old_left_outline = '''        addPolyline(svg, [
            { x: materialInnerLeft, y: frameBottom },
            leftInnerTop
        ], 'mobile-fracture-shell-edge', 0.96);'''
          new_left_outline = '''        addPolyline(svg, leftInnerWear.bottomUp, 'mobile-fracture-shell-edge', 0.96);'''
          if old_left_outline not in script:
              raise SystemExit('left inner outline anchor missing')
          script = script.replace(old_left_outline, new_left_outline, 1)

          old_right_outline = '''        addPolyline(svg, [
            { x: materialInnerRight, y: frameBottom },
            rightInnerTop
        ], 'mobile-fracture-shell-edge', 0.96);'''
          new_right_outline = '''        addPolyline(svg, rightInnerWear.bottomUp, 'mobile-fracture-shell-edge', 0.96);'''
          if old_right_outline not in script:
              raise SystemExit('right inner outline anchor missing')
          script = script.replace(old_right_outline, new_right_outline, 1)

          right_break_anchor = '''        if (crownSide !== 'right') {
            addPolyline(svg, rightCut, 'mobile-fracture-shell-break', 0.98);
        }
'''
          finish_block = '''

        // v392 · explicitly close the lower side stones along the same diagonal
        // geometry as the Index Drawer handle. This removes the two small open
        // wedges that appeared when the shell was clipped at frameBottom.
        addPolyline(svg, [leftDrawerCorner, leftDrawerFoot], 'mobile-fracture-shell-edge', 0.96);
        addPolyline(svg, [rightDrawerCorner, rightDrawerFoot], 'mobile-fracture-shell-edge', 0.96);

        // Secondary fissures begin only at the map-facing inner notch and travel
        // outward through the stone. They never originate on the viewport rim.
        leftInnerWear.cracks.forEach(points => {
            addPolyline(svg, points, 'mobile-fracture-shell-break mobile-side-inner-crack', 0.78);
        });
        rightInnerWear.cracks.forEach(points => {
            addPolyline(svg, points, 'mobile-fracture-shell-break mobile-side-inner-crack', 0.78);
        });
'''
          if 'explicitly close the lower side stones' not in script:
              if right_break_anchor not in script:
                  raise SystemExit('right break anchor missing')
              script = script.replace(right_break_anchor, right_break_anchor + finish_block, 1)

          # 4) On compact screens keep the polygon-masked frost surface, but do
          # not add the rectangular "immunity" veil behind the stone gaps.
          old_frost = '''        const frostHost = buildFrostHost(refinedCells, w, h);
        const immuneVeil = buildIndexImmuneFrost(drawer, rect);
        if (immuneVeil) layer.replaceChildren(frostHost, svg, immuneVeil);
        else layer.replaceChildren(frostHost, svg);'''
          new_frost = '''        const frostHost = buildFrostHost(refinedCells, w, h);
        const immuneVeil = compact ? null : buildIndexImmuneFrost(drawer, rect);
        if (compact) layer.replaceChildren(frostHost, svg);
        else if (immuneVeil) layer.replaceChildren(frostHost, svg, immuneVeil);
        else layer.replaceChildren(frostHost, svg);'''
          if old_frost not in script:
              raise SystemExit('frost layer anchor missing')
          script = script.replace(old_frost, new_frost, 1)

          script_path.write_text(script, encoding='utf-8')

          style = style_path.read_text(encoding='utf-8')
          marker = 'v392 · compact side inner fractures / transparent Index Drawer gaps'
          if marker not in style:
              style += r'''

/* ==========================================================================
   v392 · compact side inner fractures / transparent Index Drawer gaps
   --------------------------------------------------------------------------
   1) the page rim stays intact; damage opens from the map-facing inner rails;
   2) side stones continue through the drawer shoulder and close on its diagonals;
   3) retire the old hard-coded compact drawer skins that sat behind fracture gaps.
   ========================================================================== */
@media (max-width:900px) and (min-height:560px),
       (max-width:950px) and (max-height:560px) {
    /* v391 clipped the side stones at frameBottom, which literally cut off the
       two closing diagonals. The shell geometry now owns those closures. */
    #mobile-fracture-shell {
        clip-path: none !important;
        -webkit-clip-path: none !important;
    }

    .mobile-side-inner-crack {
        stroke-linecap: round !important;
        stroke-linejoin: round !important;
    }

    /* Written-in fallback skins found during diagnosis: these were full-area
       backgrounds underneath the procedural stone mask, so a missing fragment
       still looked opaque. Compact mode now has no unmasked drawer skin. */
    #index-drawer::before,
    #index-drawer::after {
        content: none !important;
        display: none !important;
        background: none !important;
        box-shadow: none !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
    }

    #index-drawer.index-drawer-svg-ready #index-drawer-handle .frosted-shape,
    #index-drawer-handle .frosted-shape {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
        background: none !important;
        border: 0 !important;
        box-shadow: none !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
    }

    #index-drawer-content,
    #index-drawer.index-drawer-svg-ready #index-drawer-content,
    #index-drawer > #index-stone-fragment-layer {
        background: transparent !important;
        box-shadow: none !important;
    }

    #index-stone-fragment-layer > .index-stone-crack-immunity {
        display: none !important;
        background: none !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
    }
}
'''
              style_path.write_text(style, encoding='utf-8')

          index = index_path.read_text(encoding='utf-8')
          index = re.sub(r'style\.css\?v=[^"\']+', 'style.css?v=392-mobile-inner-fractures', index, count=1)
          index = re.sub(r'script\.js\?v=[^"\']+', 'script.js?v=392-mobile-inner-fractures', index, count=1)
          index_path.write_text(index, encoding='utf-8')
          PY

      - name: Commit main-file fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js style.css index.html
          git diff --cached --check
          git commit -m 'Refine compact side fractures and drawer transparency'
          git push origin HEAD:main
