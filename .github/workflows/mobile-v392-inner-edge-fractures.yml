name: One-time mobile v392 inner-edge fracture integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-v392-inner-edge-fractures.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch mobile side geometry and drawer transparency
        shell: bash
        run: |
          python - <<'PY'
          import base64, zlib
          payload = ''
          exec(zlib.decompress(base64.b64decode(payload)).decode('utf-8'))
          PY

      - name: Commit main-file fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js style.css index.html
          git diff --cached --check
          git commit -m 'Refine compact side fractures and drawer transparency'
          git push origin HEAD:main
