name: mechanics-v109-copy

on:
  push:
    paths:
      - '.mechanics-v109-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Simplify mechanics labels and intro
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path('mechanics.js')
          s = js.read_text(encoding='utf-8')

          old_intro = "databaseIntro:{zh:'以作品为线索检索技术点，追踪实践中使用、生成或修正的技术、经验、想法、技法与工法，并将记录汇入中央「墟构工程总数据库」。',en:'Use each work as a route into its technical points, tracing techniques, experience, ideas and working methods used, generated or revised in practice, with those records feeding into the central Ruinwright Engineering Database.',ja:'作品を手掛かりに技術点を検索し、実践で用いられ、生まれ、修正された技術・経験・発想・技法・工法を追跡し、その記録を中央の墟構工程データベースへ集約します。'}"
          new_intro = "databaseIntro:{zh:'这里收集以「墟构」为目的的创作手法，包括建造废墟园林所用的工法、相关技术、工作记录与实践经验。',en:'A collection of creative methods for Ruinwrighting, including construction methods for Folly works, related techniques, work records, and practical experience.',ja:'「墟構」を目的とする創作手法を集めています。フォリーをつくるための工法、関連技術、作業記録、実践上の経験などを収録します。'}"
          if old_intro not in s:
              raise SystemExit('databaseIntro source string not found')
          s = s.replace(old_intro, new_intro, 1)

          old_sketch = "local({zh:'草图项目 / 技术点',en:'Sketch project / technical points',ja:'スケッチプロジェクト / 技術点'})"
          new_sketch = "local({zh:'草图项目',en:'Sketch project',ja:'スケッチプロジェクト'})"
          if old_sketch not in s:
              raise SystemExit('sketch category label not found')
          s = s.replace(old_sketch, new_sketch, 1)

          old_folly = "local({zh:'废墟园林作品 / 技术点',en:'Folly work / technical points',ja:'フォリー作品 / 技術点'})"
          new_folly = "local({zh:'废墟园林作品',en:'Folly work',ja:'フォリー作品'})"
          if old_folly not in s:
              raise SystemExit('folly category label not found')
          s = s.replace(old_folly, new_folly, 1)
          js.write_text(s, encoding='utf-8')

          html = Path('mechanics.html')
          h = html.read_text(encoding='utf-8')
          if 'mechanics.js?v=108' in h:
              h = h.replace('mechanics.js?v=108', 'mechanics.js?v=109', 1)
          elif 'mechanics.js?v=109' not in h:
              raise SystemExit('mechanics.js cache-bust reference not found')
          html.write_text(h, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add mechanics.js mechanics.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Simplify mechanics category labels and intro"
          git push origin HEAD:main
