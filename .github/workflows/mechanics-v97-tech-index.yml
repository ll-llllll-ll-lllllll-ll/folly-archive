name: mechanics-v97-tech-index

on:
  push:
    paths:
      - '.mechanics-v97-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply mechanics v97 patch
        run: python mechanics-v97-patch.py
      - name: Commit mechanics v97
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add mechanics.html mechanics.js mechanics-data.js
          git commit -m "Refine mechanics technical-point index" || exit 0
          git push origin main
