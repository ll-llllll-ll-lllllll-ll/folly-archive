name: Manifesto mobile UI v8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manifesto-mobile-ui-v8.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Update manifesto reader UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          txt = Path('manifesto.txt')
          s = txt.read_text(encoding='utf-8')
          s = s.replace('![破碎画框](manifesto-assets/broken-frame.svg)', '![破碎画框](manifesto-assets/broken-frame.png)')
          txt.write_text(s, encoding='utf-8')

          html = Path('manifesto.html')
          h = html.read_text(encoding='utf-8')
          needle = '    <button id="manifesto-index-toggle" class="manifesto-index-toggle" type="button" aria-controls="manifesto-index" aria-expanded="false">章节</button>\n    <strong data-i18n="title">墟构师宣言</strong>'
          replacement = '    <button id="manifesto-index-toggle" class="manifesto-index-toggle" type="button" aria-controls="manifesto-index" aria-expanded="false">章节</button>\n\n    <div class="manifesto-mobile-controls" aria-label="阅读控制">\n      <div class="mobile-reader-step" aria-label="字体大小">\n        <button type="button" data-reader-action="font-down" aria-label="减小字号">A−</button>\n        <button type="button" data-reader-action="font-up" aria-label="增大字号">A+</button>\n      </div>\n      <div class="reader-tone-control mobile-reader-tone" aria-label="护眼与黑夜模式">\n        <span class="reader-tone-icon" aria-hidden="true">☼</span>\n        <div class="reader-tone-track-wrap">\n          <input class="reader-tone-slider" data-reader-tone type="range" min="0" max="100" value="0" step="1" aria-label="护眼与黑夜模式">\n          <span class="reader-tone-warm-mark" aria-hidden="true"></span>\n        </div>\n        <span class="reader-tone-icon" aria-hidden="true">☾</span>\n      </div>\n      <div class="mobile-reader-step" aria-label="行间距">\n        <button type="button" data-reader-action="leading-down" aria-label="减小行距">≡−</button>\n        <button type="button" data-reader-action="leading-up" aria-label="增大行距">≡+</button>\n      </div>\n    </div>\n\n    <strong data-i18n="title">墟构师宣言</strong>'
          if needle not in h:
              raise SystemExit('manifesto topbar insertion point not found')
          h = h.replace(needle, replacement, 1)
          h = h.replace('manifesto.css?v=7-20261004', 'manifesto.css?v=8-20261004')
          h = h.replace('manifesto.js?v=7-20261004', 'manifesto.js?v=8-20261004')
          html.write_text(h, encoding='utf-8')

          js = Path('manifesto.js')
          j = js.read_text(encoding='utf-8')
          old_group = "  function groupCode(group,index) {\n    const prefix=group==='statement'?'S':group==='reference'?'R':'M';\n    return `${prefix}${String(index+1).padStart(2,'0')}`;\n  }"
          new_group = "  function groupNumber(group) {\n    return group==='statement' ? 2 : group==='reference' ? 3 : 1;\n  }\n\n  function sectionCode(group,sectionIndex) {\n    return `${groupNumber(group)}.${sectionIndex+1}.0`;\n  }\n\n  function subsectionCode(group,sectionIndex,subIndex) {\n    return `${groupNumber(group)}.${sectionIndex+1}.${subIndex+1}`;\n  }"
          if old_group not in j:
              raise SystemExit('groupCode block not found')
          j = j.replace(old_group, new_group, 1)
          j = j.replace("code.textContent=groupCode(group,groupIndex);", "code.textContent=sectionCode(group,groupIndex);")
          j = j.replace("subCode.textContent=tnum || String(subIndex+1).padStart(2,'0');", "subCode.textContent=subsectionCode(group,groupIndex,subIndex);")
          j = j.replace("createIndexLink(sec.id,sec.dataset.indexLabel || sec.querySelector(':scope > .manifesto-section-header h2')?.textContent || '',groupCode(group,groupIndex),false,false)", "createIndexLink(sec.id,sec.dataset.indexLabel || sec.querySelector(':scope > .manifesto-section-header h2')?.textContent || '',sectionCode(group,groupIndex),false,false)")
          j = j.replace("createIndexLink(sub.id,title,tnum || String(subIndex+1).padStart(2,'0'),true,Boolean(tnum))", "createIndexLink(sub.id,title,subsectionCode(group,groupIndex,subIndex),true,Boolean(tnum))")
          j = j.replace("      history.replaceState(null,'',`#${targetId}`);\n      closeIndex();", "      history.replaceState(null,'',`#${targetId}`);")
          old_outside = "  document.addEventListener('pointerdown',event=>{\n    if (!document.body.classList.contains('manifesto-index-open')) return;\n    if (indexEl?.contains(event.target) || indexToggle?.contains(event.target)) return;\n    closeIndex();\n  },true);"
          new_outside = "  document.addEventListener('click',event=>{\n    if (!document.body.classList.contains('manifesto-index-open')) return;\n    if (indexEl?.contains(event.target) || indexToggle?.contains(event.target)) return;\n    closeIndex();\n  });"
          if old_outside not in j:
              raise SystemExit('drawer outside handler not found')
          j = j.replace(old_outside, new_outside, 1)
          cover_anchor = "    if (parsed.meta.subtitle) {\n      const sub=document.createElement('div');\n      sub.className='manifesto-title-subtitle';\n      sub.textContent=parsed.meta.subtitle;\n      titleBlock.appendChild(sub);\n    }\n\n    if (parsed.meta.epigraph) {"
          cover_replacement = "    if (parsed.meta.subtitle) {\n      const sub=document.createElement('div');\n      sub.className='manifesto-title-subtitle';\n      sub.textContent=parsed.meta.subtitle;\n      titleBlock.appendChild(sub);\n    }\n\n    const cover=document.createElement('figure');\n    cover.className='manifesto-cover';\n    const coverImg=document.createElement('img');\n    coverImg.src='manifesto-assets/broken-frame.png';\n    coverImg.alt=lang==='en' ? 'Broken Frame' : lang==='ja' ? '壊れたフレーム' : '破碎画框';\n    coverImg.decoding='async';\n    coverImg.fetchPriority='high';\n    cover.appendChild(coverImg);\n    titleBlock.appendChild(cover);\n\n    if (parsed.meta.epigraph) {"
          if cover_anchor not in j:
              raise SystemExit('cover insertion point not found')
          j = j.replace(cover_anchor, cover_replacement, 1)
          js.write_text(j, encoding='utf-8')

          css = Path('manifesto.css')
          c = css.read_text(encoding='utf-8')
          marker = '/* Manifesto v8 — mobile controls, hierarchical locators, original cover */'
          css_b64 = ''
          if marker not in c:
              c += base64.b64decode(css_b64).decode('utf-8')
          css.write_text(c, encoding='utf-8')
          PY

          grep -q 'manifesto-assets/broken-frame.png' manifesto.txt
          grep -q 'manifesto-mobile-controls' manifesto.html
          grep -q 'subsectionCode' manifesto.js
          grep -q 'Manifesto v8' manifesto.css
          node --check manifesto.js

      - name: Commit manifesto UI v8
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git rm .github/workflows/manifesto-mobile-ui-v8.yml
          git add manifesto.html manifesto.css manifesto.js manifesto.txt manifesto-assets/broken-frame.png
          git commit -m "Refine manifesto mobile reader and original artwork"
          git push origin HEAD:main
