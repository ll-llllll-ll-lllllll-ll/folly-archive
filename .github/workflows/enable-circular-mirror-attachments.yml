name: Enable Circular Mirror Remnant Attachments

on:
  push:
    paths:
      - '.github/workflows/enable-circular-mirror-attachments.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Register Circular Mirror Remnant archive images
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('script.js')
          text = path.read_text(encoding='utf-8')

          if "'circularmirror-01':" not in text:
              registry_anchor = "\n\n\n    'earthwall-01': {"
              if registry_anchor not in text:
                  raise SystemExit('attachment registry anchor not found')

              block = '''\n\n    'circularmirror-01': {\n        title: 'specimen_visual',\n        mode: 'image',\n        src: 'attachments/circular-mirror-remnant/photo-1.jpg',\n        desc: 'desc_recorded_2026_10_01'\n    },\n    'circularmirror-02': {\n        title: 'specimen_visual',\n        mode: 'image',\n        src: 'attachments/circular-mirror-remnant/photo-2.jpg',\n        desc: 'desc_recorded_2026_10_01'\n    },\n    'circularmirror-03': {\n        title: 'specimen_visual',\n        mode: 'image',\n        src: 'attachments/circular-mirror-remnant/photo-3.jpg',\n        desc: 'desc_recorded_2026_10_01'\n    },\n    'circularmirror-04': {\n        title: 'specimen_visual',\n        mode: 'image',\n        src: 'attachments/circular-mirror-remnant/photo-4.jpg',\n        desc: 'desc_recorded_2026_10_01'\n    },\n    'circularmirror-05': {\n        title: 'specimen_visual',\n        mode: 'image',\n        src: 'attachments/circular-mirror-remnant/photo-5.jpg',\n        desc: 'desc_recorded_2026_10_01'\n    },\n    'circularmirror-06': {\n        title: 'specimen_visual',\n        mode: 'image',\n        src: 'attachments/circular-mirror-remnant/photo-6.jpg',\n        desc: 'desc_recorded_2026_10_01'\n    },\n    'circularmirror-07': {\n        title: 'specimen_visual',\n        mode: 'image',\n        src: 'attachments/circular-mirror-remnant/photo-7.jpg',\n        desc: 'desc_recorded_2026_10_01'\n    },\n    'circularmirror-08': {\n        title: 'specimen_visual',\n        mode: 'image',\n        src: 'attachments/circular-mirror-remnant/photo-8.jpg',\n        desc: 'desc_recorded_2026_10_01'\n    },\n'''
              text = text.replace(registry_anchor, block + registry_anchor, 1)

          if 'const isCircularMirrorRemnant' not in text:
              flag_anchor = '''    const isGrassChildDwelling =\n        site.name === "草间稚居";\n'''
              if flag_anchor not in text:
                  raise SystemExit('site flag anchor not found')
              flag_block = flag_anchor + '''\n    const isCircularMirrorRemnant =\n        site.name === "圆镜残境";\n'''
              text = text.replace(flag_anchor, flag_block, 1)

          if "buildArchiveTree(\n                'circularmirror'" not in text:
              branch_anchor = '''    else if (isGrassChildDwelling) {\n\n        treeHTML =\n            buildArchiveTree(\n                'grassdwelling',\n                '遗构录'\n            );\n\n    }\n    else if (isCastle) {'''
              if branch_anchor not in text:
                  raise SystemExit('archive tree branch anchor not found')
              branch_block = '''    else if (isGrassChildDwelling) {\n\n        treeHTML =\n            buildArchiveTree(\n                'grassdwelling',\n                '遗构录'\n            );\n\n    }\n    else if (isCircularMirrorRemnant) {\n\n        treeHTML =\n            buildArchiveTree(\n                'circularmirror',\n                '遗构录'\n            );\n\n    }\n    else if (isCastle) {'''
              text = text.replace(branch_anchor, branch_block, 1)

          path.write_text(text, encoding='utf-8')
          PY

          node --check script.js

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          rm .github/workflows/enable-circular-mirror-attachments.yml
          git add script.js .github/workflows/enable-circular-mirror-attachments.yml
          git commit -m "Read Circular Mirror Remnant image archive"
          git push origin HEAD:main
