name: mobile-v393-fractures

on:
  push:
    paths:
      - '.mobile-v393-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply mobile v393 fracture patch
        run: python mobile-v393-patch.py
      - name: Commit mobile v393
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add script.js index.html
          git commit -m "Diversify mobile side fractures and sparse drawer cracks" || exit 0
          git push origin main
