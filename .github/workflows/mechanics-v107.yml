name: mechanics-v107

on:
  push:
    paths:
      - '.mechanics-v107-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply v107 UI patch
        run: python mechanics-v107-patch.py
      - name: Sync mechanics assets from folders
        run: python scripts/sync-mechanics-assets.py
      - name: Commit v107
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add mechanics.html mechanics.css mechanics.js mechanics-data.js
          git commit -m "Refine mechanics rack and auto-index assets" || exit 0
          git push origin HEAD:main
