name: Finalize V7 manifesto figure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manifesto-v7-image-path.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Point manuscript figure at vector asset
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('manifesto.txt')
          s = p.read_text(encoding='utf-8')
          old = '![破碎画框](manifesto-assets/broken-frame.webp)'
          new = '![破碎画框](manifesto-assets/broken-frame.svg)'
          if old not in s and new not in s:
              raise SystemExit('broken-frame reference not found')
          p.write_text(s.replace(old, new), encoding='utf-8')

          css = Path('manifesto.css')
          c = css.read_text(encoding='utf-8')
          old_filter = 'filter:var(--manifesto-image-filter,none);'
          new_filter = 'filter:invert(var(--reader-drawing-invert,0)) brightness(var(--reader-drawing-brightness,1)) contrast(var(--reader-drawing-contrast,1));'
          if old_filter in c:
              c = c.replace(old_filter, new_filter)
          css.write_text(c, encoding='utf-8')
          PY
          grep -q 'manifesto-assets/broken-frame.svg' manifesto.txt
          node --check manifesto.js
      - name: Commit finalized V7 reader
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git rm .github/workflows/manifesto-v7-image-path.yml
          git add manifesto.txt manifesto.css
          git commit -m "Finalize V7 manifesto figure and tone handling"
          git push origin HEAD:main
