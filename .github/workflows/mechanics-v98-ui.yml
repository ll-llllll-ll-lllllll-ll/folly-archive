name: mechanics-v98-ui

on:
  push:
    paths:
      - '.mechanics-v98-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply mechanics v98 patch
        run: python mechanics-v98-patch.py
      - name: Commit mechanics v98
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add mechanics.html mechanics.css mechanics.js
          git commit -m "Refine mechanics technical-point index and file rack" || exit 0
          git push origin main
