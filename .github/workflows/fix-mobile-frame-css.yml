name: One-time mobile frame CSS normalization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile-frame-css.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Normalize integrated v391 CSS and bust cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          style_path = Path('style.css')
          index_path = Path('index.html')

          style = style_path.read_text(encoding='utf-8')
          marker = '/* ==========================================================================' + '\\n' + '   v391 · compact outer rim / side wear / single index-drawer plate'
          start = style.find(marker)
          if start < 0:
              raise SystemExit('v391 escaped CSS block not found')

          head = style[:start]
          block = style[start:]
          block = block.replace('\\n', '\n')
          style_path.write_text(head + block, encoding='utf-8')

          index = index_path.read_text(encoding='utf-8')
          index = index.replace('style.css?v=391-mobile-frame-integrated', 'style.css?v=391-mobile-frame-integrated-fix1')
          index_path.write_text(index, encoding='utf-8')
          PY
      - name: Commit CSS normalization
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style.css index.html
          git commit -m 'Fix integrated mobile frame CSS formatting'
          git push origin HEAD:main
