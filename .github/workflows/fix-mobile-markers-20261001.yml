name: Fix mobile markers 2026-10-01

on:
  push:
    branches:
      - fix/mobile-markers-20261001
    paths:
      - '.github/workflows/fix-mobile-markers-20261001.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-markers-20261001
          fetch-depth: 1
      - name: Repair site registry string
        run: python scripts/fix-mobile-markers-20261001.py
      - name: Validate JavaScript
        run: |
          node --check data/site-data.js
          node --check data/language-vault.js
          node --check script.js
      - name: Commit tested repair
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git rm .github/workflows/fix-mobile-markers-20261001.yml scripts/fix-mobile-markers-20261001.py
          git add data/site-data.js
          git commit -m "Fix mobile marker registry parsing"
          git push origin HEAD:fix/mobile-markers-20261001
