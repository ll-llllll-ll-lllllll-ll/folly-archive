name: mechanics-v97-patch

on:
  push:
    paths:
      - '.mechanics-v97-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch mechanics v97
        run: python mechanics-v97-patch.py
      - name: Commit v97
        run: |
          rm -f .github/workflows/mechanics-v97-patch.yml .mechanics-v97-trigger mechanics-v97-patch.py
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "Refine mechanics technical index and taxonomy spine"
          git push origin main
