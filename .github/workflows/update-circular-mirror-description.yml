name: Update Circular Mirror Remnant description

on:
  push:
    paths:
      - '.github/workflows/update-circular-mirror-description.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Replace Circular Mirror Remnant description
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          zh = '''原啤酒厂的发酵设施迁离后，只留下成列的混凝土基座。白瓷砖从柱壁与圆环边缘一点点剥落，草木沿裂缝侵入其间。这里被本地年轻人称作一处“梦核”之地：置身嘈杂的市中心，却意外留下了一块规划之外的净土。

它没有典型废墟的粗粝与阴森。人在基座与柱群之间行走时，水平视野被高差与结构遮断，天空只从一个个镂空的圆环中显露出来。阳光穿过洞口，在残存的白瓷砖之间反复漫射，视线近处只剩下柱子和密集生长的植被。

这些圆洞原本只是发酵罐撤去后留下的负形，如今却成了观看新城市的取景框。抬头时，一个个巨大的圆形洞口像嵌进遗构中的镜框，将天空与周围持续生长的城市切成彼此分离的局部。'''

          en = '''After the former brewery’s fermentation facilities were relocated, only rows of concrete bases remained. White tiles peel away little by little from the column walls and the rims of the circular openings, while vegetation pushes into the cracks. Local young people call this a “dreamcore” place: set in the noisy city center, it has unexpectedly left behind a sanctuary outside the plan.

It lacks the roughness and gloom typically associated with ruins. Walking among the bases and columns, the horizontal field of view is cut off by changes in level and by the structure itself; the sky appears only through the hollow circular openings. Sunlight passes through the openings and repeatedly diffuses across the surviving white tiles, while the near field of vision is reduced to columns and densely growing vegetation.

These circular openings were originally negative spaces left after the fermentation tanks were removed; now they have become viewfinders onto the new city. Looking up, the enormous circles resemble mirror frames embedded in the relic, cutting the sky and the continuously growing city into separate fragments.'''

          ja = '''旧ビール工場の発酵設備が移設されたあと、列をなすコンクリートの基座だけが残された。白いタイルは柱壁や円環の縁から少しずつ剥がれ、草木が亀裂からその内部へ侵入している。ここは地元の若者たちから「ドリームコア」の場所と呼ばれている。騒がしい市中心部にありながら、計画の外側にある浄土のような空間が、思いがけず残されている。

そこには典型的な廃墟の粗さや陰鬱さがない。基座と柱群のあいだを歩くと、高低差と構造によって水平方向の視界が遮られ、空は中空の円環からだけ姿を現す。陽光は開口を通り、残された白いタイルのあいだで繰り返し拡散し、近くの視界には柱と密生する植生だけが残る。

これらの円孔は、もともと発酵タンクが撤去されたあとに残った負の形にすぎなかった。いまでは、新しい都市を見るためのファインダーへと変わっている。見上げると、巨大な円形の開口は遺構に嵌め込まれた鏡枠のように、空と周囲で成長を続ける都市を互いに切り離された断片として切り取る。'''

          # Base Chinese site registry.
          site_path = Path('data/site-data.js')
          site = site_path.read_text(encoding='utf-8')
          site_pattern = re.compile(r'(\{\s*\n\s*name:\s*"圆镜残境",\s*\n)\s*desc:\s*"[\s\S]*?"(,\s*\n\s*lat:\s*23\.1072778,)')
          replacement = r'\1        desc: ' + json.dumps(zh, ensure_ascii=False) + r'\2'
          site, count = site_pattern.subn(replacement, site, count=1)
          if count != 1:
              raise SystemExit(f'site-data replacement count: {count}')
          site_path.write_text(site, encoding='utf-8')

          # Keep all three language variants aligned with the revised Chinese text.
          vault_path = Path('data/language-vault.js')
          vault = vault_path.read_text(encoding='utf-8')

          def single_quote(value):
              return "'" + value.replace('\\', '\\\\').replace("'", "\\'").replace('\n', '\\n') + "'"

          for lang, value in [('zh', zh), ('en', en), ('ja', ja)]:
              pattern = re.compile(r'(Object\.assign\(vault\.' + lang + r',\s*\{[\s\S]*?site_desc_圆镜残境:\s*)\'(?:\\[\s\S]|[^\'\\])*\'')
              vault, count = pattern.subn(lambda m: m.group(1) + single_quote(value), vault, count=1)
              if count != 1:
                  raise SystemExit(f'language-vault {lang} replacement count: {count}')

          vault_path.write_text(vault, encoding='utf-8')

          # Sanity checks.
          assert zh in site_path.read_text(encoding='utf-8').replace('\\n', '\n')
          final_vault = vault_path.read_text(encoding='utf-8')
          assert '水平视野被高差与结构遮断' in final_vault
          assert 'horizontal field of view is cut off' in final_vault
          assert '水平方向の視界が遮られ' in final_vault
          PY
      - name: Commit revised copy and remove temporary workflow
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git rm .github/workflows/update-circular-mirror-description.yml
          git add data/site-data.js data/language-vault.js
          git commit -m "Refine Circular Mirror Remnant description"
          git push origin HEAD:main
