name: mechanics-v115-mobile

on:
  push:
    paths:
      - '.mechanics-v115-trigger'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply v115 mobile patch
        run: python mechanics-v115-mobile-patch.py
      - name: Check JavaScript syntax
        run: node --check mechanics.js
      - name: Install Selenium
        run: python -m pip install --quiet selenium
      - name: Start local site
        run: |
          python -m http.server 8000 >/tmp/mechanics-v115-server.log 2>&1 &
          sleep 2
      - name: Run mobile smoke test
        run: python mechanics-v115-mobile-smoke.py
      - name: Commit main-file changes
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add mechanics.html mechanics.css mechanics.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Redesign mechanics mobile workspace"
          git push origin HEAD:main
