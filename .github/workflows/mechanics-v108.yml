name: mechanics-v108

on:
  push:
    paths:
      - '.mechanics-v108-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply mechanics v108 patch
        run: python mechanics-v108-patch.py
      - name: Commit mechanics v108
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add mechanics.html mechanics.css mechanics.js
          git commit -m "Refine mechanics viewer and file navigation" || exit 0
          git push origin HEAD:main
