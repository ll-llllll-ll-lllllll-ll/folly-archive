name: One-time mobile frame direct integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-frame-direct-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fold compact frame finish into the main files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          style_path = Path('style.css')
          script_path = Path('script.js')
          index_path = Path('index.html')
          site_data_path = Path('data/site-data.js')
          site_data_base_path = Path('data/site-data-base.js')
          css_sidecar = Path('mobile-frame-finish.css')
          js_sidecar = Path('mobile-frame-finish.js')

          css_marker = 'v391 · compact outer rim / side wear / single index-drawer plate'
          js_marker = 'v391 · compact outer rim / side wear renderer (integrated)'

          style = style_path.read_text(encoding='utf-8')
          css = css_sidecar.read_text(encoding='utf-8').strip()
          if css_marker not in style:
              style = style.rstrip() + '\n\n' + css + '\n'
              style_path.write_text(style, encoding='utf-8')

          script = script_path.read_text(encoding='utf-8')
          js = js_sidecar.read_text(encoding='utf-8').strip()
          if js_marker not in script:
              script = script.rstrip() + (
                  '\n\n// ============================================================================\n'
                  '// v391 · compact outer rim / side wear renderer (integrated)\n'
                  '// ============================================================================\n'
                  + js + '\n'
              )
              script_path.write_text(script, encoding='utf-8')

          index = index_path.read_text(encoding='utf-8')
          shell_line = '    <div id="mobile-fracture-shell" aria-hidden="true"></div>'
          rim_line = '    <div id="mobile-outer-rim" aria-hidden="true"></div>'
          if 'id="mobile-outer-rim"' not in index:
              index = index.replace(shell_line, shell_line + '\n' + rim_line, 1)
          index = index.replace('style.css?v=390-runtime-cleanup', 'style.css?v=391-mobile-frame-integrated')
          index = index.replace('script.js?v=390-runtime-cleanup', 'script.js?v=391-mobile-frame-integrated')
          index_path.write_text(index, encoding='utf-8')

          if site_data_base_path.exists():
              site_data_path.write_text(site_data_base_path.read_text(encoding='utf-8'), encoding='utf-8')

          for obsolete in (css_sidecar, js_sidecar, site_data_base_path):
              if obsolete.exists():
                  obsolete.unlink()
          PY

      - name: Commit integrated main-file implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No integration changes needed.'
            exit 0
          fi
          git commit -m 'Integrate mobile frame finish into main files'
          git push origin HEAD:main
