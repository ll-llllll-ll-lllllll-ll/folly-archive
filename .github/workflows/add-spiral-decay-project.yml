name: add-spiral-decay-project

on:
  push:
    paths:
      - '.spiral-decay-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Add spiral decay sketch project
        run: python scripts/add-spiral-decay-project.py
      - name: Commit project
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add mechanics-assets/projects/spiral-decay scripts/sync-mechanics-assets.py mechanics-data.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add Spiral Decay sketch project"
          git push origin HEAD:main
