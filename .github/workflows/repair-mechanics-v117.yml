name: Repair mechanics v117
on:
  push:
    paths:
      - '.github/workflows/repair-mechanics-v117.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore mechanics core and apply v117
        run: |
          git show d788f69929ea4484e7e0cc1a4a61b0dc426826d8:mechanics.js > mechanics.js
          python - <<'PY'
          from pathlib import Path
          p=Path('mechanics.js')
          s=p.read_text()
          s=s.replace('activeRecordIndex = options.recordIndex ?? selection.records.length - 1;', 'activeRecordIndex = options.recordIndex ?? 0;', 1)
          s=s.replace('options.recordIndex ?? records.length - 1', 'options.recordIndex ?? 0', 1)
          s=s.replace("const index = Math.max(0, (parseInt(indexRaw, 10) || selection.records.length) - 1);", "const index = Math.max(0, (parseInt(indexRaw, 10) || 1) - 1);", 1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mechanics.js
          git commit -m 'Open first mechanics archive file by default'
          git push
