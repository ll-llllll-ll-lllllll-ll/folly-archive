name: Repair mechanics v117
on:
  push:
    paths:
      - '.github/workflows/repair-mechanics-v117.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire v118 reference layout and clear cache keys
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('mechanics.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('ruin-language.js?v=75', 'ruin-language.js?v=118')
          p.write_text(s, encoding='utf-8')

          p = Path('ruin-language.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("script.src = 'mechanics-mobile-v116.js?v=116';", "script.src = 'mechanics-mobile-v116.js?v=118';")
          p.write_text(s, encoding='utf-8')

          p = Path('mechanics-mobile-v116.js')
          s = p.read_text(encoding='utf-8')
          loader = """

// v118 visual layer: loaded after the stable v116 mobile workspace exists.
(() => {
  if (document.querySelector('script[data-mechanics-mobile-v118]')) return;
  const script = document.createElement('script');
  script.src = 'mechanics-mobile-v118.js?v=118';
  script.dataset.mechanicsMobileV118 = 'true';
  script.async = false;
  (document.body || document.documentElement).appendChild(script);
})();
"""
          if 'data-mechanics-mobile-v118' not in s:
              s += loader
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/apply-mechanics-v118.yml
          rm -f .github/workflows/repair-mechanics-v117.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+ll-llllll-ll-lllllll-ll@users.noreply.github.com
          git add -A
          git commit -m 'Wire mechanics v118 reference mobile layout'
          git push
