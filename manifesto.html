<body>
  <header class="manifesto-topbar">
    <button id="manifesto-index-toggle" class="manifesto-index-toggle" type="button" aria-controls="manifesto-index" aria-expanded="false">章节</button>

    <div class="manifesto-mobile-controls" aria-label="阅读控制">
      <div class="mobile-reader-step" aria-label="字体大小">
        <button type="button" data-reader-action="font-down" aria-label="减小字号">A−</button>
        <button type="button" data-reader-action="font-up" aria-label="增大字号">A+</button>
      </div>
      <div class="reader-tone-control mobile-reader-tone" aria-label="护眼与黑夜模式">
        <span class="reader-tone-icon" aria-hidden="true">☼</span>
        <div class="reader-tone-track-wrap">
          <input class="reader-tone-slider" data-reader-tone type="range" min="0" max="100" value="0" step="1" aria-label="护眼与黑夜模式">
          <span class="reader-tone-warm-mark" aria-hidden="true"></span>
        </div>
        <span class="reader-tone-icon" aria-hidden="true">☾</span>
      </div>
      <div class="mobile-reader-step" aria-label="行间距">
        <button type="button" data-reader-action="leading-down" aria-label="减小行距">≡−</button>
        <button type="button" data-reader-action="leading-up" aria-label="增大行距">≡+</button>
      </div>
    </div>

    <strong data-i18n="title">墟构师宣言</strong>

    <nav class="manifesto-links">
      <a href="mechanics.html" data-i18n="mechanics">墟构机械数据库 ↗</a>
      <a href="index.html" data-i18n="archive">遗构馆 ↗</a>
    </nav>

    <div class="manifesto-actions">
      <div class="manifesto-desktop-controls" aria-label="阅读排版">
        <div class="top-reader-step" aria-label="行间距">
          <span class="top-reader-key" aria-hidden="true">≡</span>
          <button type="button" data-reader-action="leading-down" aria-label="减小行距">−</button>
          <span id="reader-leading-value" class="top-reader-value">1.96</span>
          <button type="button" data-reader-action="leading-up" aria-label="增大行距">+</button>
        </div>
        <div class="top-reader-step" aria-label="字体大小">
          <span class="top-reader-key" aria-hidden="true">Aa</span>
          <button type="button" data-reader-action="font-down" aria-label="减小字号">−</button>
          <span id="reader-font-value" class="top-reader-value">16.5</span>
          <button type="button" data-reader-action="font-up" aria-label="增大字号">+</button>
        </div>
      </div>

      <div class="reader-tone-control" aria-label="阅读环境">
        <span class="reader-tone-icon" aria-hidden="true">☼</span>
        <div class="reader-tone-track-wrap">
          <input class="reader-tone-slider" data-reader-tone type="range" min="0" max="100" value="0" step="1" aria-label="阅读环境">
          <span class="reader-tone-warm-mark" aria-hidden="true"></span>
        </div>
        <span class="reader-tone-icon" aria-hidden="true">☾</span>
      </div>

      <div class="language-switch" aria-label="Language">
        <button type="button" data-lang-switch="zh">中</button>
        <span>/</span>
        <button type="button" data-lang-switch="en">EN</button>
        <span>/</span>
        <button type="button" data-lang-switch="ja">JP</button>
      </div>
    </div>
  </header>

  <main class="manifesto-reader">
    <aside id="manifesto-index" class="manifesto-index" aria-label="章节">
      <div class="manifesto-index-head">
        <div class="manifesto-index-label" data-i18n="contents">章节</div>
        <button id="manifesto-index-close" class="manifesto-index-close" type="button" aria-label="关闭">×</button>
      </div>
      <nav id="manifesto-index-nav"></nav>
    </aside>

    <section id="manifesto-scroll" class="manifesto-scroll" tabindex="0">
      <div id="manifesto-measure-guide" class="manifesto-measure-guide" aria-hidden="true">
        <span class="measure-guide-mark is-left"></span>
        <span class="measure-guide-mark is-right"></span>
      </div>

      <article id="manifesto-document" class="manifesto-document" aria-live="polite">
        <div class="manifesto-loading" data-i18n="loading">正在读取文本…</div>
      </article>
    </section>

    <div id="manifesto-margin-ruler" class="manifesto-margin-ruler" aria-label="正文左右边距">
      <span class="margin-ruler-ticks" aria-hidden="true"></span>
      <span class="margin-ruler-cap is-left" aria-hidden="true"></span>
      <span class="margin-ruler-cap is-right" aria-hidden="true"></span>
      <button class="margin-ruler-handle is-left" type="button" data-margin-side="left" role="slider" aria-label="左侧正文边距" aria-orientation="horizontal" aria-valuemin="4" aria-valuemax="38" aria-valuenow="11.5"></button>
      <button class="margin-ruler-handle is-right" type="button" data-margin-side="right" role="slider" aria-label="右侧正文边距" aria-orientation="horizontal" aria-valuemin="4" aria-valuemax="38" aria-valuenow="11.5"></button>
    </div>
  </main>

  <div id="footnote-popover" class="footnote-popover" role="tooltip" hidden>
    <div id="footnote-popover-number" class="footnote-popover-number"></div>
    <div id="footnote-popover-text"></div>
  </div>

  <script src="manifesto-translations.js?v=2-20261004"></script>
  <script src="manifesto.js?v=8-20261004"></script>
  <script src="manifesto-frontmatter-v14.js?v=6-20261005"></script>
  <script src="manifesto-layout-v11.js?v=1-20261004"></script>
